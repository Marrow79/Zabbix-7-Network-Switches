zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: 36bff6c29af64692839d077febfc7079
    name: Templates/Network devices
  templates:
  - uuid: fc79d281077541f89529dbf138deba4f
    template: Cisco Meraki MS220-24P by SNMP
    name: Cisco Meraki MS220-24P by SNMP
    description: Meraki MS220-24P-HW (MS220) local-device SNMP template for Zabbix 7.0.30. 24 nominal RJ45 front-panel port class; stated PoE budget 370 W (hardware
      spec only, NOT monitored via local SNMP). Layer 2; PoE+. SNMP polling requires Network-wide > Configure > General local SNMP, NOT the separate Meraki dashboard
      cloud SNMP endpoint. Local standard SNMPv2-MIB/IF-MIB OIDs only; no unsupported proprietary cloud-MIB device OIDs. 64-bit high capacity counters are attempted
      but may be missing on older firmware; 32-bit fallback is also provided.
    groups:
    - name: Templates/Network devices
    items:
    - uuid: 490b88cc414442178f2ecdada2298e53
      name: ICMP ping
      type: SIMPLE
      key: icmpping
      delay: 1m
      tags:
      - tag: component
        value: health
      triggers:
      - uuid: 813e89c93a5a418b8bf75eaf6f87bab9
        expression: max(/Cisco Meraki MS220-24P by SNMP/icmpping,#3)=0
        name: 'MS220-24P: Unavailable by ICMP'
        priority: HIGH
        description: Device failed three consecutive ICMP checks.
        tags:
        - tag: scope
          value: availability
    - uuid: 7f65b6313be7420d9f48e74db2afb661
      name: ICMP packet loss
      type: SIMPLE
      key: icmppingloss
      delay: 1m
      value_type: FLOAT
      units: '%'
      tags:
      - tag: component
        value: health
      triggers:
      - uuid: 0cdbb957fed9491ba53363126e623851
        expression: min(/Cisco Meraki MS220-24P by SNMP/icmppingloss,5m)>{$MERAKI.ICMP.LOSS.WARN} and min(/Cisco Meraki MS220-24P by SNMP/icmppingloss,5m)<100
        name: 'MS220-24P: High packet loss'
        priority: WARNING
        description: Packet loss exceeds macro threshold for five minutes.
        tags:
        - tag: scope
          value: performance
    - uuid: d20afe5354a949feb87b6dae1f67a439
      name: ICMP response time
      type: SIMPLE
      key: icmppingsec
      delay: 1m
      value_type: FLOAT
      units: s
      tags:
      - tag: component
        value: health
      triggers:
      - uuid: bb72910de8d5403e94f067403efd4b26
        expression: avg(/Cisco Meraki MS220-24P by SNMP/icmppingsec,5m)>{$MERAKI.ICMP.RTT.WARN}
        name: 'MS220-24P: High ICMP RTT'
        priority: WARNING
        description: Average response time exceeds macro threshold for five minutes.
        tags:
        - tag: scope
          value: performance
    - uuid: 7532d3902ea5437ca984204e7a3b6dca
      name: SNMP sysUpTime
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.3.0]
      key: meraki.sys.uptime
      delay: 1m
      units: uptime
      description: SNMP agent uptime in seconds; sysUpTime Timeticks converted /100. Not hardware uptime.
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: component
        value: health
      triggers:
      - uuid: 48e1d633b5ea4fce831fb5daa544b815
        expression: nodata(/Cisco Meraki MS220-24P by SNMP/meraki.sys.uptime,15m)=1 and last(/Cisco Meraki MS220-24P by SNMP/icmpping)=1
        name: 'MS220-24P: SNMP stopped responding'
        priority: AVERAGE
        description: ICMP works but sysUpTime stopped updating. Check local device SNMP and credentials.
        tags:
        - tag: scope
          value: availability
    - uuid: dae018827d2748e0baa7703725d35115
      name: System description
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.1.0]
      key: meraki.sys.description
      delay: 1h
      value_type: CHAR
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 12h
      tags:
      - tag: component
        value: inventory
    - uuid: 51dedc11bf204defa7f4b6d036c3ed2a
      name: System name
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.5.0]
      key: meraki.sys.name
      delay: 1h
      value_type: CHAR
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 12h
      tags:
      - tag: component
        value: inventory
    - uuid: 93e292a3b5a64deca1d10e4a2013bb3e
      name: System object ID
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.2.0]
      key: meraki.sys.objectid
      delay: 1h
      value_type: CHAR
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 12h
      tags:
      - tag: component
        value: inventory
    - uuid: 5b90b540f6f4421aa3b7fb827dba038e
      name: System contact
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.4.0]
      key: meraki.sys.contact
      delay: 1h
      value_type: CHAR
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 12h
      tags:
      - tag: component
        value: inventory
    - uuid: 1ada610948044ffc8777475bba93d50c
      name: System location
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.6.0]
      key: meraki.sys.location
      delay: 1h
      value_type: CHAR
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 12h
      tags:
      - tag: component
        value: inventory
    - uuid: 675d40372d714592b2edd2a87bc85016
      name: SNMP availability reported by Zabbix
      type: INTERNAL
      key: zabbix[host,snmp,available]
      delay: 1m
      description: 1 available, 0 unavailable, 2 unknown; Zabbix internal check.
      tags:
      - tag: component
        value: health
    discovery_rules:
    - uuid: db1e365d7d124fbca705793e2e3b39b9
      name: Network interfaces via IF-MIB
      type: SNMP_AGENT
      snmp_oid: discovery[{#IFDESCR},1.3.6.1.2.1.2.2.1.2,{#IFADMINSTATUS},1.3.6.1.2.1.2.2.1.7]
      key: meraki.if.discovery
      delay: 1h
      description: Discover IF-MIB interfaces by index (do not assume fixed SNMP index to port number).
      filter:
        conditions:
        - macro: '{#IFDESCR}'
          value: '{$MERAKI.IF.MATCHES}'
      item_prototypes:
      - uuid: 4fe8c7f1db344e37bb140a4bc25b29ba
        name: 'Interface {#IFDESCR}: Operational status'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.8.{#SNMPINDEX}]
        key: meraki.if.operstatus[{#SNMPINDEX}]
        delay: 2m
        valuemap:
          name: IF-MIB interface status
        tags:
        - tag: component
          value: network
      - uuid: 96dbf73a09b24d15b1cbc3e8dd5506b6
        name: 'Interface {#IFDESCR}: Administrative status'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.7.{#SNMPINDEX}]
        key: meraki.if.adminstatus[{#SNMPINDEX}]
        delay: 5m
        valuemap:
          name: IF-MIB admin status
        tags:
        - tag: component
          value: network
      - uuid: 1db6d804cc6b4119b180754ed63804b5
        name: 'Interface {#IFDESCR}: Incoming traffic 64-bit'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.31.1.1.1.6.{#SNMPINDEX}]
        key: meraki.if.in.hc[{#SNMPINDEX}]
        delay: 1m
        value_type: FLOAT
        units: bps
        description: IF-MIB ifHCInOctets; availability varies by model/firmware. If unsupported, use 32-bit fallback (less reliable at high speed).
        preprocessing:
        - type: CHANGE_PER_SECOND
          parameters:
          - ''
        - type: MULTIPLIER
          parameters:
          - '8'
        tags:
        - tag: component
          value: traffic
      - uuid: 169ac20f1eb74a3f9b21155ae049885d
        name: 'Interface {#IFDESCR}: Outgoing traffic 64-bit'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.31.1.1.1.10.{#SNMPINDEX}]
        key: meraki.if.out.hc[{#SNMPINDEX}]
        delay: 1m
        value_type: FLOAT
        units: bps
        preprocessing:
        - type: CHANGE_PER_SECOND
          parameters:
          - ''
        - type: MULTIPLIER
          parameters:
          - '8'
        tags:
        - tag: component
          value: traffic
      - uuid: 50357f3425314ae999e3ec5dd8c8a39f
        name: 'Interface {#IFDESCR}: Incoming traffic 32-bit fallback'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.10.{#SNMPINDEX}]
        key: meraki.if.in.legacy[{#SNMPINDEX}]
        delay: 1m
        value_type: FLOAT
        units: bps
        description: Legacy counter may wrap quickly on busy 1G/10G ports; 64-bit graph preferred when supported.
        preprocessing:
        - type: CHANGE_PER_SECOND
          parameters:
          - ''
        - type: MULTIPLIER
          parameters:
          - '8'
        tags:
        - tag: component
          value: traffic
      - uuid: 11574382a9e54e599525c08fc783639c
        name: 'Interface {#IFDESCR}: Outgoing traffic 32-bit fallback'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.16.{#SNMPINDEX}]
        key: meraki.if.out.legacy[{#SNMPINDEX}]
        delay: 1m
        value_type: FLOAT
        units: bps
        preprocessing:
        - type: CHANGE_PER_SECOND
          parameters:
          - ''
        - type: MULTIPLIER
          parameters:
          - '8'
        tags:
        - tag: component
          value: traffic
      - uuid: a8e8c76cbc98472ab4abffa00fb8d271
        name: 'Interface {#IFDESCR}: Input errors'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.14.{#SNMPINDEX}]
        key: meraki.if.in.errors[{#SNMPINDEX}]
        delay: 2m
        value_type: FLOAT
        units: pps
        preprocessing:
        - type: CHANGE_PER_SECOND
          parameters:
          - ''
        tags:
        - tag: component
          value: errors
      - uuid: e210b10f7e184d7d9393b5a16820f22c
        name: 'Interface {#IFDESCR}: Output errors'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.20.{#SNMPINDEX}]
        key: meraki.if.out.errors[{#SNMPINDEX}]
        delay: 2m
        value_type: FLOAT
        units: pps
        preprocessing:
        - type: CHANGE_PER_SECOND
          parameters:
          - ''
        tags:
        - tag: component
          value: errors
      - uuid: 497381db2f734c05abaac66b914c8664
        name: 'Interface {#IFDESCR}: Input discards'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.13.{#SNMPINDEX}]
        key: meraki.if.in.discards[{#SNMPINDEX}]
        delay: 2m
        value_type: FLOAT
        units: pps
        preprocessing:
        - type: CHANGE_PER_SECOND
          parameters:
          - ''
        tags:
        - tag: component
          value: errors
      - uuid: 5ca899eff39d4f85935120d72bbcab94
        name: 'Interface {#IFDESCR}: Output discards'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.19.{#SNMPINDEX}]
        key: meraki.if.out.discards[{#SNMPINDEX}]
        delay: 2m
        value_type: FLOAT
        units: pps
        preprocessing:
        - type: CHANGE_PER_SECOND
          parameters:
          - ''
        tags:
        - tag: component
          value: errors
      graph_prototypes:
      - uuid: be3512439c744d828f1d32297133bc44
        name: 'Interface {#IFDESCR}: Traffic 64-bit'
        graph_items:
        - color: 199C0D
          item:
            host: Cisco Meraki MS220-24P by SNMP
            key: meraki.if.in.hc[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Cisco Meraki MS220-24P by SNMP
            key: meraki.if.out.hc[{#SNMPINDEX}]
      - uuid: a85c9b49f46a4388837d9107546d1eec
        name: 'Interface {#IFDESCR}: Traffic 32-bit fallback'
        graph_items:
        - color: 199C0D
          item:
            host: Cisco Meraki MS220-24P by SNMP
            key: meraki.if.in.legacy[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Cisco Meraki MS220-24P by SNMP
            key: meraki.if.out.legacy[{#SNMPINDEX}]
      - uuid: 0076b9d64df944f2879a6a3d7da34bd1
        name: 'Interface {#IFDESCR}: Errors and discards'
        graph_items:
        - color: 199C0D
          item:
            host: Cisco Meraki MS220-24P by SNMP
            key: meraki.if.in.errors[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Cisco Meraki MS220-24P by SNMP
            key: meraki.if.out.errors[{#SNMPINDEX}]
        - sortorder: '2'
          color: 2774A4
          item:
            host: Cisco Meraki MS220-24P by SNMP
            key: meraki.if.in.discards[{#SNMPINDEX}]
        - sortorder: '3'
          color: 8E44AD
          item:
            host: Cisco Meraki MS220-24P by SNMP
            key: meraki.if.out.discards[{#SNMPINDEX}]
      trigger_prototypes:
      - uuid: f8e903c711064699aa90842b3db36584
        expression: '{$MERAKI.IF.ALERT:"{#IFDESCR}"}=1 and last(/Cisco Meraki MS220-24P by SNMP/meraki.if.operstatus[{#SNMPINDEX}])=2 and last(/Cisco Meraki MS220-24P
          by SNMP/meraki.if.adminstatus[{#SNMPINDEX}])=1'
        name: 'MS220-24P: Interface {#IFDESCR} down'
        priority: AVERAGE
        description: Opt in for critical interfaces by adding context macro {$MERAKI.IF.ALERT:"<ifDescr>"}=1 on host; otherwise default 0 avoids noisy access-port
          alerts.
        tags:
        - tag: scope
          value: availability
    macros:
    - macro: '{$MERAKI.ICMP.LOSS.WARN}'
      value: '20'
      description: ICMP loss % sustained over 5m
    - macro: '{$MERAKI.ICMP.RTT.WARN}'
      value: '0.15'
      description: Average ICMP RTT in seconds over 5m
    - macro: '{$MERAKI.IF.MATCHES}'
      value: .*
      description: Regex for interface discovery
    - macro: '{$MERAKI.IF.ALERT}'
      value: '0'
      description: Interface-down alert disabled unless context macro is set to 1 for critical interface
    valuemaps:
    - uuid: 1c15a3610c914009b9bafd78fbc09550
      name: IF-MIB interface status
      mappings:
      - value: '1'
        newvalue: up
      - value: '2'
        newvalue: down
      - value: '3'
        newvalue: testing
      - value: '4'
        newvalue: unknown
      - value: '5'
        newvalue: dormant
      - value: '6'
        newvalue: notPresent
      - value: '7'
        newvalue: lowerLayerDown
    - uuid: 3ab9c2d93c00467c931aee2369e66591
      name: IF-MIB admin status
      mappings:
      - value: '1'
        newvalue: up
      - value: '2'
        newvalue: down
      - value: '3'
        newvalue: testing
