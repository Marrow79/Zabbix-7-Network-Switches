zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: 36bff6c29af64692839d077febfc7079
    name: Templates/Network devices
  templates:
  - uuid: c9cdd1f62c9f4a6a9a62d0380bb0177d
    template: Cisco Meraki MS220-48FP by SNMP
    name: Cisco Meraki MS220-48FP by SNMP
    description: Meraki MS220-48FP-HW (MS220) local-device SNMP template for Zabbix 7.0.30. 48 nominal RJ45 front-panel port class; stated PoE budget 740 W (hardware
      spec only, NOT monitored via local SNMP). Layer 2; PoE+. SNMP polling requires Network-wide > Configure > General local SNMP, NOT the separate Meraki dashboard
      cloud SNMP endpoint. Local standard SNMPv2-MIB/IF-MIB OIDs only; no unsupported proprietary cloud-MIB device OIDs. 64-bit high capacity counters are attempted
      but may be missing on older firmware; 32-bit fallback is also provided.
    groups:
    - name: Templates/Network devices
    items:
    - uuid: 5445f72ca34d469396a32ee63a4baedd
      name: ICMP ping
      type: SIMPLE
      key: icmpping
      delay: 1m
      tags:
      - tag: component
        value: health
      triggers:
      - uuid: 4b09fcc12c8c4bf2a9c99d975da64d53
        expression: max(/Cisco Meraki MS220-48FP by SNMP/icmpping,#3)=0
        name: 'MS220-48FP: Unavailable by ICMP'
        priority: HIGH
        description: Device failed three consecutive ICMP checks.
        tags:
        - tag: scope
          value: availability
    - uuid: 5d0b984ab6394e1f95635aba7a8e9bb7
      name: ICMP packet loss
      type: SIMPLE
      key: icmppingloss
      delay: 1m
      value_type: FLOAT
      units: '%'
      tags:
      - tag: component
        value: health
      triggers:
      - uuid: 3e12bfcb9ee14afc976350f0ff4919e8
        expression: min(/Cisco Meraki MS220-48FP by SNMP/icmppingloss,5m)>{$MERAKI.ICMP.LOSS.WARN} and min(/Cisco Meraki MS220-48FP by SNMP/icmppingloss,5m)<100
        name: 'MS220-48FP: High packet loss'
        priority: WARNING
        description: Packet loss exceeds macro threshold for five minutes.
        tags:
        - tag: scope
          value: performance
    - uuid: a6b82ec0e4ca4b2ebb81c97084eb9432
      name: ICMP response time
      type: SIMPLE
      key: icmppingsec
      delay: 1m
      value_type: FLOAT
      units: s
      tags:
      - tag: component
        value: health
      triggers:
      - uuid: afaf5ebac9c64aada1ecdac3d957a0d7
        expression: avg(/Cisco Meraki MS220-48FP by SNMP/icmppingsec,5m)>{$MERAKI.ICMP.RTT.WARN}
        name: 'MS220-48FP: High ICMP RTT'
        priority: WARNING
        description: Average response time exceeds macro threshold for five minutes.
        tags:
        - tag: scope
          value: performance
    - uuid: b76455ef1a164152ae61a59e9e430bb5
      name: SNMP sysUpTime
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.3.0]
      key: meraki.sys.uptime
      delay: 1m
      units: uptime
      description: SNMP agent uptime in seconds; sysUpTime Timeticks converted /100. Not hardware uptime.
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: component
        value: health
      triggers:
      - uuid: ce6622ffbb2b4aa4a58790618b88222d
        expression: nodata(/Cisco Meraki MS220-48FP by SNMP/meraki.sys.uptime,15m)=1 and last(/Cisco Meraki MS220-48FP by SNMP/icmpping)=1
        name: 'MS220-48FP: SNMP stopped responding'
        priority: AVERAGE
        description: ICMP works but sysUpTime stopped updating. Check local device SNMP and credentials.
        tags:
        - tag: scope
          value: availability
    - uuid: 51390873d3a54d85abf5297f69b7406e
      name: System description
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.1.0]
      key: meraki.sys.description
      delay: 1h
      value_type: CHAR
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 12h
      tags:
      - tag: component
        value: inventory
    - uuid: 5c937b39c1d24955a489b1a08a338c31
      name: System name
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.5.0]
      key: meraki.sys.name
      delay: 1h
      value_type: CHAR
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 12h
      tags:
      - tag: component
        value: inventory
    - uuid: 3b9f7bf983f54ca1b3d8f816601d8c25
      name: System object ID
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.2.0]
      key: meraki.sys.objectid
      delay: 1h
      value_type: CHAR
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 12h
      tags:
      - tag: component
        value: inventory
    - uuid: aef86bd4a11b43da9dea13493a0d8be6
      name: System contact
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.4.0]
      key: meraki.sys.contact
      delay: 1h
      value_type: CHAR
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 12h
      tags:
      - tag: component
        value: inventory
    - uuid: 62e974240ce6415a8729cc0cc0cfb4d7
      name: System location
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.6.0]
      key: meraki.sys.location
      delay: 1h
      value_type: CHAR
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 12h
      tags:
      - tag: component
        value: inventory
    - uuid: b31c6d78ed7a44ffa4e2f4f8d0c531a9
      name: SNMP availability reported by Zabbix
      type: INTERNAL
      key: zabbix[host,snmp,available]
      delay: 1m
      description: 1 available, 0 unavailable, 2 unknown; Zabbix internal check.
      tags:
      - tag: component
        value: health
    discovery_rules:
    - uuid: 46ba0189179a47f094f7b02fcac3aca9
      name: Network interfaces via IF-MIB
      type: SNMP_AGENT
      snmp_oid: discovery[{#IFDESCR},1.3.6.1.2.1.2.2.1.2,{#IFADMINSTATUS},1.3.6.1.2.1.2.2.1.7]
      key: meraki.if.discovery
      delay: 1h
      description: Discover IF-MIB interfaces by index (do not assume fixed SNMP index to port number).
      filter:
        conditions:
        - macro: '{#IFDESCR}'
          value: '{$MERAKI.IF.MATCHES}'
      item_prototypes:
      - uuid: ae33fa3188f84d68a76efa6f139aeee1
        name: 'Interface {#IFDESCR}: Operational status'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.8.{#SNMPINDEX}]
        key: meraki.if.operstatus[{#SNMPINDEX}]
        delay: 2m
        valuemap:
          name: IF-MIB interface status
        tags:
        - tag: component
          value: network
      - uuid: a0f4dbfc7a5d4838b5a3f0fd45f7d722
        name: 'Interface {#IFDESCR}: Administrative status'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.7.{#SNMPINDEX}]
        key: meraki.if.adminstatus[{#SNMPINDEX}]
        delay: 5m
        valuemap:
          name: IF-MIB admin status
        tags:
        - tag: component
          value: network
      - uuid: 4121a04c09fa413db4a0965f857e8b70
        name: 'Interface {#IFDESCR}: Incoming traffic 64-bit'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.31.1.1.1.6.{#SNMPINDEX}]
        key: meraki.if.in.hc[{#SNMPINDEX}]
        delay: 1m
        value_type: FLOAT
        units: bps
        description: IF-MIB ifHCInOctets; availability varies by model/firmware. If unsupported, use 32-bit fallback (less reliable at high speed).
        preprocessing:
        - type: CHANGE_PER_SECOND
          parameters:
          - ''
        - type: MULTIPLIER
          parameters:
          - '8'
        tags:
        - tag: component
          value: traffic
      - uuid: 179c91f7b9ab4b5ab3a2d7b0a646660d
        name: 'Interface {#IFDESCR}: Outgoing traffic 64-bit'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.31.1.1.1.10.{#SNMPINDEX}]
        key: meraki.if.out.hc[{#SNMPINDEX}]
        delay: 1m
        value_type: FLOAT
        units: bps
        preprocessing:
        - type: CHANGE_PER_SECOND
          parameters:
          - ''
        - type: MULTIPLIER
          parameters:
          - '8'
        tags:
        - tag: component
          value: traffic
      - uuid: 652ff1a4fc164b7eb6041e914d0d112b
        name: 'Interface {#IFDESCR}: Incoming traffic 32-bit fallback'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.10.{#SNMPINDEX}]
        key: meraki.if.in.legacy[{#SNMPINDEX}]
        delay: 1m
        value_type: FLOAT
        units: bps
        description: Legacy counter may wrap quickly on busy 1G/10G ports; 64-bit graph preferred when supported.
        preprocessing:
        - type: CHANGE_PER_SECOND
          parameters:
          - ''
        - type: MULTIPLIER
          parameters:
          - '8'
        tags:
        - tag: component
          value: traffic
      - uuid: 2d1fdf0ff37242998c5321a73f7323fa
        name: 'Interface {#IFDESCR}: Outgoing traffic 32-bit fallback'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.16.{#SNMPINDEX}]
        key: meraki.if.out.legacy[{#SNMPINDEX}]
        delay: 1m
        value_type: FLOAT
        units: bps
        preprocessing:
        - type: CHANGE_PER_SECOND
          parameters:
          - ''
        - type: MULTIPLIER
          parameters:
          - '8'
        tags:
        - tag: component
          value: traffic
      - uuid: 3964c6ae0e89498d9ca3335ae6a767d0
        name: 'Interface {#IFDESCR}: Input errors'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.14.{#SNMPINDEX}]
        key: meraki.if.in.errors[{#SNMPINDEX}]
        delay: 2m
        value_type: FLOAT
        units: pps
        preprocessing:
        - type: CHANGE_PER_SECOND
          parameters:
          - ''
        tags:
        - tag: component
          value: errors
      - uuid: 5fadbd09b43c4e3fb4cbf7190f251caa
        name: 'Interface {#IFDESCR}: Output errors'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.20.{#SNMPINDEX}]
        key: meraki.if.out.errors[{#SNMPINDEX}]
        delay: 2m
        value_type: FLOAT
        units: pps
        preprocessing:
        - type: CHANGE_PER_SECOND
          parameters:
          - ''
        tags:
        - tag: component
          value: errors
      - uuid: 22f7e3058fcc4bc4a88e4abc88fa5807
        name: 'Interface {#IFDESCR}: Input discards'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.13.{#SNMPINDEX}]
        key: meraki.if.in.discards[{#SNMPINDEX}]
        delay: 2m
        value_type: FLOAT
        units: pps
        preprocessing:
        - type: CHANGE_PER_SECOND
          parameters:
          - ''
        tags:
        - tag: component
          value: errors
      - uuid: d9584f1234f949ba8a7ff277c71e2de2
        name: 'Interface {#IFDESCR}: Output discards'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.19.{#SNMPINDEX}]
        key: meraki.if.out.discards[{#SNMPINDEX}]
        delay: 2m
        value_type: FLOAT
        units: pps
        preprocessing:
        - type: CHANGE_PER_SECOND
          parameters:
          - ''
        tags:
        - tag: component
          value: errors
      graph_prototypes:
      - uuid: 850f544f698344c5a723df178a238826
        name: 'Interface {#IFDESCR}: Traffic 64-bit'
        graph_items:
        - color: 199C0D
          item:
            host: Cisco Meraki MS220-48FP by SNMP
            key: meraki.if.in.hc[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Cisco Meraki MS220-48FP by SNMP
            key: meraki.if.out.hc[{#SNMPINDEX}]
      - uuid: 101c460fa66941a581a7c9a0abf8bdcc
        name: 'Interface {#IFDESCR}: Traffic 32-bit fallback'
        graph_items:
        - color: 199C0D
          item:
            host: Cisco Meraki MS220-48FP by SNMP
            key: meraki.if.in.legacy[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Cisco Meraki MS220-48FP by SNMP
            key: meraki.if.out.legacy[{#SNMPINDEX}]
      - uuid: bbec0a0b03da4f029d27e6e42f5a7909
        name: 'Interface {#IFDESCR}: Errors and discards'
        graph_items:
        - color: 199C0D
          item:
            host: Cisco Meraki MS220-48FP by SNMP
            key: meraki.if.in.errors[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Cisco Meraki MS220-48FP by SNMP
            key: meraki.if.out.errors[{#SNMPINDEX}]
        - sortorder: '2'
          color: 2774A4
          item:
            host: Cisco Meraki MS220-48FP by SNMP
            key: meraki.if.in.discards[{#SNMPINDEX}]
        - sortorder: '3'
          color: 8E44AD
          item:
            host: Cisco Meraki MS220-48FP by SNMP
            key: meraki.if.out.discards[{#SNMPINDEX}]
      trigger_prototypes:
      - uuid: 17869c8f1ff24f158731031e41025af8
        expression: '{$MERAKI.IF.ALERT:"{#IFDESCR}"}=1 and last(/Cisco Meraki MS220-48FP by SNMP/meraki.if.operstatus[{#SNMPINDEX}])=2 and last(/Cisco Meraki MS220-48FP
          by SNMP/meraki.if.adminstatus[{#SNMPINDEX}])=1'
        name: 'MS220-48FP: Interface {#IFDESCR} down'
        priority: AVERAGE
        description: Opt in for critical interfaces by adding context macro {$MERAKI.IF.ALERT:"<ifDescr>"}=1 on host; otherwise default 0 avoids noisy access-port
          alerts.
        tags:
        - tag: scope
          value: availability
    macros:
    - macro: '{$MERAKI.ICMP.LOSS.WARN}'
      value: '20'
      description: ICMP loss % sustained over 5m
    - macro: '{$MERAKI.ICMP.RTT.WARN}'
      value: '0.15'
      description: Average ICMP RTT in seconds over 5m
    - macro: '{$MERAKI.IF.MATCHES}'
      value: .*
      description: Regex for interface discovery
    - macro: '{$MERAKI.IF.ALERT}'
      value: '0'
      description: Interface-down alert disabled unless context macro is set to 1 for critical interface
    valuemaps:
    - uuid: 7bb99aedc5144f5e9fbac181ef37c63e
      name: IF-MIB interface status
      mappings:
      - value: '1'
        newvalue: up
      - value: '2'
        newvalue: down
      - value: '3'
        newvalue: testing
      - value: '4'
        newvalue: unknown
      - value: '5'
        newvalue: dormant
      - value: '6'
        newvalue: notPresent
      - value: '7'
        newvalue: lowerLayerDown
    - uuid: dbdf33b848c043bb86610055fa850db7
      name: IF-MIB admin status
      mappings:
      - value: '1'
        newvalue: up
      - value: '2'
        newvalue: down
      - value: '3'
        newvalue: testing
