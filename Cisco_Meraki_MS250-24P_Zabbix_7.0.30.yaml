zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: 36bff6c29af64692839d077febfc7079
    name: Templates/Network devices
  templates:
  - uuid: 7a44a0aad14f4b2f8fff4116e9c24d2d
    template: Cisco Meraki MS250-24P by SNMP
    name: Cisco Meraki MS250-24P by SNMP
    description: Meraki MS250-24P-HW (MS250) local-device SNMP template for Zabbix 7.0.30. 24 nominal RJ45 front-panel port class; stated PoE budget 370 W (hardware
      spec only, NOT monitored via local SNMP). Layer 3; PoE+; stacking. SNMP polling requires Network-wide > Configure > General local SNMP, NOT the separate Meraki
      dashboard cloud SNMP endpoint. Local standard SNMPv2-MIB/IF-MIB OIDs only; no unsupported proprietary cloud-MIB device OIDs. 64-bit high capacity counters are
      attempted but may be missing on older firmware; 32-bit fallback is also provided.
    groups:
    - name: Templates/Network devices
    items:
    - uuid: 2ca6bbcad2f847b7999bbc63656a3898
      name: ICMP ping
      type: SIMPLE
      key: icmpping
      delay: 1m
      tags:
      - tag: component
        value: health
      triggers:
      - uuid: afd51c0d1f4f42489c64d7ab968cfd63
        expression: max(/Cisco Meraki MS250-24P by SNMP/icmpping,#3)=0
        name: 'MS250-24P: Unavailable by ICMP'
        priority: HIGH
        description: Device failed three consecutive ICMP checks.
        tags:
        - tag: scope
          value: availability
    - uuid: 15e5723edf1f4fc78f54e84cac57fda3
      name: ICMP packet loss
      type: SIMPLE
      key: icmppingloss
      delay: 1m
      value_type: FLOAT
      units: '%'
      tags:
      - tag: component
        value: health
      triggers:
      - uuid: 7d0da5cac6f549079486ba60eb1f5f9c
        expression: min(/Cisco Meraki MS250-24P by SNMP/icmppingloss,5m)>{$MERAKI.ICMP.LOSS.WARN} and min(/Cisco Meraki MS250-24P by SNMP/icmppingloss,5m)<100
        name: 'MS250-24P: High packet loss'
        priority: WARNING
        description: Packet loss exceeds macro threshold for five minutes.
        tags:
        - tag: scope
          value: performance
    - uuid: b0ce115452da4f229733fbb598f085c0
      name: ICMP response time
      type: SIMPLE
      key: icmppingsec
      delay: 1m
      value_type: FLOAT
      units: s
      tags:
      - tag: component
        value: health
      triggers:
      - uuid: dee5728e55b8473ead11c5b6b85dd330
        expression: avg(/Cisco Meraki MS250-24P by SNMP/icmppingsec,5m)>{$MERAKI.ICMP.RTT.WARN}
        name: 'MS250-24P: High ICMP RTT'
        priority: WARNING
        description: Average response time exceeds macro threshold for five minutes.
        tags:
        - tag: scope
          value: performance
    - uuid: 3504c4d09dd94634b41e63d991004ba0
      name: SNMP sysUpTime
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.3.0]
      key: meraki.sys.uptime
      delay: 1m
      units: uptime
      description: SNMP agent uptime in seconds; sysUpTime Timeticks converted /100. Not hardware uptime.
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: component
        value: health
      triggers:
      - uuid: ca03e05034b448d7961536d0e6aba661
        expression: nodata(/Cisco Meraki MS250-24P by SNMP/meraki.sys.uptime,15m)=1 and last(/Cisco Meraki MS250-24P by SNMP/icmpping)=1
        name: 'MS250-24P: SNMP stopped responding'
        priority: AVERAGE
        description: ICMP works but sysUpTime stopped updating. Check local device SNMP and credentials.
        tags:
        - tag: scope
          value: availability
    - uuid: c2f4401578964f7aa36ef0b527bc4624
      name: System description
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.1.0]
      key: meraki.sys.description
      delay: 1h
      value_type: CHAR
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 12h
      tags:
      - tag: component
        value: inventory
    - uuid: 127c51bdebf5438fb4ddeeda10cee085
      name: System name
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.5.0]
      key: meraki.sys.name
      delay: 1h
      value_type: CHAR
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 12h
      tags:
      - tag: component
        value: inventory
    - uuid: fd0e464cba8a4c199eafd5c983e564bd
      name: System object ID
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.2.0]
      key: meraki.sys.objectid
      delay: 1h
      value_type: CHAR
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 12h
      tags:
      - tag: component
        value: inventory
    - uuid: bef6beed012b428496b1ab192239f745
      name: System contact
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.4.0]
      key: meraki.sys.contact
      delay: 1h
      value_type: CHAR
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 12h
      tags:
      - tag: component
        value: inventory
    - uuid: f2570b4602aa4f12b49657be746b8885
      name: System location
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.6.0]
      key: meraki.sys.location
      delay: 1h
      value_type: CHAR
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 12h
      tags:
      - tag: component
        value: inventory
    - uuid: 0449f06736264731a06b06f58815f9e4
      name: SNMP availability reported by Zabbix
      type: INTERNAL
      key: zabbix[host,snmp,available]
      delay: 1m
      description: 1 available, 0 unavailable, 2 unknown; Zabbix internal check.
      tags:
      - tag: component
        value: health
    discovery_rules:
    - uuid: 020a8d4411b4417980d3a3bbda66f9e3
      name: Network interfaces via IF-MIB
      type: SNMP_AGENT
      snmp_oid: discovery[{#IFDESCR},1.3.6.1.2.1.2.2.1.2,{#IFADMINSTATUS},1.3.6.1.2.1.2.2.1.7]
      key: meraki.if.discovery
      delay: 1h
      description: Discover IF-MIB interfaces by index (do not assume fixed SNMP index to port number).
      filter:
        conditions:
        - macro: '{#IFDESCR}'
          value: '{$MERAKI.IF.MATCHES}'
      item_prototypes:
      - uuid: ad0fc208cbf74166b0d032ac99745fd4
        name: 'Interface {#IFDESCR}: Operational status'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.8.{#SNMPINDEX}]
        key: meraki.if.operstatus[{#SNMPINDEX}]
        delay: 2m
        valuemap:
          name: IF-MIB interface status
        tags:
        - tag: component
          value: network
      - uuid: be0f7f1dcc2a4a6195978f0d23e98843
        name: 'Interface {#IFDESCR}: Administrative status'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.7.{#SNMPINDEX}]
        key: meraki.if.adminstatus[{#SNMPINDEX}]
        delay: 5m
        valuemap:
          name: IF-MIB admin status
        tags:
        - tag: component
          value: network
      - uuid: 823728e1240945bc846862076b125bec
        name: 'Interface {#IFDESCR}: Incoming traffic 64-bit'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.31.1.1.1.6.{#SNMPINDEX}]
        key: meraki.if.in.hc[{#SNMPINDEX}]
        delay: 1m
        value_type: FLOAT
        units: bps
        description: IF-MIB ifHCInOctets; availability varies by model/firmware. If unsupported, use 32-bit fallback (less reliable at high speed).
        preprocessing:
        - type: CHANGE_PER_SECOND
          parameters:
          - ''
        - type: MULTIPLIER
          parameters:
          - '8'
        tags:
        - tag: component
          value: traffic
      - uuid: 469397cbd63a4fb2b3d849f7326ed680
        name: 'Interface {#IFDESCR}: Outgoing traffic 64-bit'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.31.1.1.1.10.{#SNMPINDEX}]
        key: meraki.if.out.hc[{#SNMPINDEX}]
        delay: 1m
        value_type: FLOAT
        units: bps
        preprocessing:
        - type: CHANGE_PER_SECOND
          parameters:
          - ''
        - type: MULTIPLIER
          parameters:
          - '8'
        tags:
        - tag: component
          value: traffic
      - uuid: f62dc795383a4d71860f8296d429782b
        name: 'Interface {#IFDESCR}: Incoming traffic 32-bit fallback'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.10.{#SNMPINDEX}]
        key: meraki.if.in.legacy[{#SNMPINDEX}]
        delay: 1m
        value_type: FLOAT
        units: bps
        description: Legacy counter may wrap quickly on busy 1G/10G ports; 64-bit graph preferred when supported.
        preprocessing:
        - type: CHANGE_PER_SECOND
          parameters:
          - ''
        - type: MULTIPLIER
          parameters:
          - '8'
        tags:
        - tag: component
          value: traffic
      - uuid: cec30bc6578f421c80d9e7a99b75f5b8
        name: 'Interface {#IFDESCR}: Outgoing traffic 32-bit fallback'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.16.{#SNMPINDEX}]
        key: meraki.if.out.legacy[{#SNMPINDEX}]
        delay: 1m
        value_type: FLOAT
        units: bps
        preprocessing:
        - type: CHANGE_PER_SECOND
          parameters:
          - ''
        - type: MULTIPLIER
          parameters:
          - '8'
        tags:
        - tag: component
          value: traffic
      - uuid: 99d48c12b5104b29aa789fd6ca3aa63d
        name: 'Interface {#IFDESCR}: Input errors'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.14.{#SNMPINDEX}]
        key: meraki.if.in.errors[{#SNMPINDEX}]
        delay: 2m
        value_type: FLOAT
        units: pps
        preprocessing:
        - type: CHANGE_PER_SECOND
          parameters:
          - ''
        tags:
        - tag: component
          value: errors
      - uuid: 4d50e9b6ef554c35a0c044d99f107f05
        name: 'Interface {#IFDESCR}: Output errors'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.20.{#SNMPINDEX}]
        key: meraki.if.out.errors[{#SNMPINDEX}]
        delay: 2m
        value_type: FLOAT
        units: pps
        preprocessing:
        - type: CHANGE_PER_SECOND
          parameters:
          - ''
        tags:
        - tag: component
          value: errors
      - uuid: ba605bfe356041d19d7f86a2b704280b
        name: 'Interface {#IFDESCR}: Input discards'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.13.{#SNMPINDEX}]
        key: meraki.if.in.discards[{#SNMPINDEX}]
        delay: 2m
        value_type: FLOAT
        units: pps
        preprocessing:
        - type: CHANGE_PER_SECOND
          parameters:
          - ''
        tags:
        - tag: component
          value: errors
      - uuid: f9ede3123be347b18631307dbde295ce
        name: 'Interface {#IFDESCR}: Output discards'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.19.{#SNMPINDEX}]
        key: meraki.if.out.discards[{#SNMPINDEX}]
        delay: 2m
        value_type: FLOAT
        units: pps
        preprocessing:
        - type: CHANGE_PER_SECOND
          parameters:
          - ''
        tags:
        - tag: component
          value: errors
      graph_prototypes:
      - uuid: c1c7b4eca26a4687a5dc16693451d179
        name: 'Interface {#IFDESCR}: Traffic 64-bit'
        graph_items:
        - color: 199C0D
          item:
            host: Cisco Meraki MS250-24P by SNMP
            key: meraki.if.in.hc[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Cisco Meraki MS250-24P by SNMP
            key: meraki.if.out.hc[{#SNMPINDEX}]
      - uuid: ee05d062a0ca473dbaef5e33a71b0165
        name: 'Interface {#IFDESCR}: Traffic 32-bit fallback'
        graph_items:
        - color: 199C0D
          item:
            host: Cisco Meraki MS250-24P by SNMP
            key: meraki.if.in.legacy[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Cisco Meraki MS250-24P by SNMP
            key: meraki.if.out.legacy[{#SNMPINDEX}]
      - uuid: a34cbc95396c45c4ad0f7a921c0ceecf
        name: 'Interface {#IFDESCR}: Errors and discards'
        graph_items:
        - color: 199C0D
          item:
            host: Cisco Meraki MS250-24P by SNMP
            key: meraki.if.in.errors[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Cisco Meraki MS250-24P by SNMP
            key: meraki.if.out.errors[{#SNMPINDEX}]
        - sortorder: '2'
          color: 2774A4
          item:
            host: Cisco Meraki MS250-24P by SNMP
            key: meraki.if.in.discards[{#SNMPINDEX}]
        - sortorder: '3'
          color: 8E44AD
          item:
            host: Cisco Meraki MS250-24P by SNMP
            key: meraki.if.out.discards[{#SNMPINDEX}]
      trigger_prototypes:
      - uuid: 9eda6189c10f49428febd17926ed9910
        expression: '{$MERAKI.IF.ALERT:"{#IFDESCR}"}=1 and last(/Cisco Meraki MS250-24P by SNMP/meraki.if.operstatus[{#SNMPINDEX}])=2 and last(/Cisco Meraki MS250-24P
          by SNMP/meraki.if.adminstatus[{#SNMPINDEX}])=1'
        name: 'MS250-24P: Interface {#IFDESCR} down'
        priority: AVERAGE
        description: Opt in for critical interfaces by adding context macro {$MERAKI.IF.ALERT:"<ifDescr>"}=1 on host; otherwise default 0 avoids noisy access-port
          alerts.
        tags:
        - tag: scope
          value: availability
    macros:
    - macro: '{$MERAKI.ICMP.LOSS.WARN}'
      value: '20'
      description: ICMP loss % sustained over 5m
    - macro: '{$MERAKI.ICMP.RTT.WARN}'
      value: '0.15'
      description: Average ICMP RTT in seconds over 5m
    - macro: '{$MERAKI.IF.MATCHES}'
      value: .*
      description: Regex for interface discovery
    - macro: '{$MERAKI.IF.ALERT}'
      value: '0'
      description: Interface-down alert disabled unless context macro is set to 1 for critical interface
    valuemaps:
    - uuid: 8fa09382fb3e48eab68830107312776d
      name: IF-MIB interface status
      mappings:
      - value: '1'
        newvalue: up
      - value: '2'
        newvalue: down
      - value: '3'
        newvalue: testing
      - value: '4'
        newvalue: unknown
      - value: '5'
        newvalue: dormant
      - value: '6'
        newvalue: notPresent
      - value: '7'
        newvalue: lowerLayerDown
    - uuid: b356e792ee1a44588b7b1a6a4d861792
      name: IF-MIB admin status
      mappings:
      - value: '1'
        newvalue: up
      - value: '2'
        newvalue: down
      - value: '3'
        newvalue: testing
