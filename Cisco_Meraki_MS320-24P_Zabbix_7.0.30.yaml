zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: 36bff6c29af64692839d077febfc7079
    name: Templates/Network devices
  templates:
  - uuid: b1e09867fc434819849441b67e25ff25
    template: Cisco Meraki MS320-24P by SNMP
    name: Cisco Meraki MS320-24P by SNMP
    description: Meraki MS320-24P-HW (MS320) local-device SNMP template for Zabbix 7.0.30. 24 nominal RJ45 front-panel port class; stated PoE budget 370 W (hardware
      spec only, NOT monitored via local SNMP). Layer 3; PoE+. SNMP polling requires Network-wide > Configure > General local SNMP, NOT the separate Meraki dashboard
      cloud SNMP endpoint. Local standard SNMPv2-MIB/IF-MIB OIDs only; no unsupported proprietary cloud-MIB device OIDs. 64-bit high capacity counters are attempted
      but may be missing on older firmware; 32-bit fallback is also provided.
    groups:
    - name: Templates/Network devices
    items:
    - uuid: 75dd3435e5f24e3990651d416dcaec06
      name: ICMP ping
      type: SIMPLE
      key: icmpping
      delay: 1m
      tags:
      - tag: component
        value: health
      triggers:
      - uuid: e7dce72d41354d9a88a61af68747f071
        expression: max(/Cisco Meraki MS320-24P by SNMP/icmpping,#3)=0
        name: 'MS320-24P: Unavailable by ICMP'
        priority: HIGH
        description: Device failed three consecutive ICMP checks.
        tags:
        - tag: scope
          value: availability
    - uuid: 8fd3427e5e6841b2a1c392df66252813
      name: ICMP packet loss
      type: SIMPLE
      key: icmppingloss
      delay: 1m
      value_type: FLOAT
      units: '%'
      tags:
      - tag: component
        value: health
      triggers:
      - uuid: 13d0a6d1ba634c66a1a342f4880cf502
        expression: min(/Cisco Meraki MS320-24P by SNMP/icmppingloss,5m)>{$MERAKI.ICMP.LOSS.WARN} and min(/Cisco Meraki MS320-24P by SNMP/icmppingloss,5m)<100
        name: 'MS320-24P: High packet loss'
        priority: WARNING
        description: Packet loss exceeds macro threshold for five minutes.
        tags:
        - tag: scope
          value: performance
    - uuid: 9ad5c44fb06e4ce99cb2bae1d4f34d68
      name: ICMP response time
      type: SIMPLE
      key: icmppingsec
      delay: 1m
      value_type: FLOAT
      units: s
      tags:
      - tag: component
        value: health
      triggers:
      - uuid: d48b46e6598243e98edc3691ce50eae8
        expression: avg(/Cisco Meraki MS320-24P by SNMP/icmppingsec,5m)>{$MERAKI.ICMP.RTT.WARN}
        name: 'MS320-24P: High ICMP RTT'
        priority: WARNING
        description: Average response time exceeds macro threshold for five minutes.
        tags:
        - tag: scope
          value: performance
    - uuid: 063ed90593db42e1a7cdc73f8b0e2547
      name: SNMP sysUpTime
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.3.0]
      key: meraki.sys.uptime
      delay: 1m
      units: uptime
      description: SNMP agent uptime in seconds; sysUpTime Timeticks converted /100. Not hardware uptime.
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: component
        value: health
      triggers:
      - uuid: 0c82b08dbf944ea2b5de9e5eab7f3a14
        expression: nodata(/Cisco Meraki MS320-24P by SNMP/meraki.sys.uptime,15m)=1 and last(/Cisco Meraki MS320-24P by SNMP/icmpping)=1
        name: 'MS320-24P: SNMP stopped responding'
        priority: AVERAGE
        description: ICMP works but sysUpTime stopped updating. Check local device SNMP and credentials.
        tags:
        - tag: scope
          value: availability
    - uuid: 9daf7c5e1e9143ac91cd04597d9cb411
      name: System description
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.1.0]
      key: meraki.sys.description
      delay: 1h
      value_type: CHAR
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 12h
      tags:
      - tag: component
        value: inventory
    - uuid: 5bb5b54f5b494e9eb1eacb99ed1224e6
      name: System name
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.5.0]
      key: meraki.sys.name
      delay: 1h
      value_type: CHAR
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 12h
      tags:
      - tag: component
        value: inventory
    - uuid: 5e9ec283d363416a80e56dfda5313868
      name: System object ID
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.2.0]
      key: meraki.sys.objectid
      delay: 1h
      value_type: CHAR
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 12h
      tags:
      - tag: component
        value: inventory
    - uuid: d6573963d416489d8a66cc2d013473cc
      name: System contact
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.4.0]
      key: meraki.sys.contact
      delay: 1h
      value_type: CHAR
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 12h
      tags:
      - tag: component
        value: inventory
    - uuid: 8bd4c223367745d884ba727cd5793d6b
      name: System location
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.6.0]
      key: meraki.sys.location
      delay: 1h
      value_type: CHAR
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 12h
      tags:
      - tag: component
        value: inventory
    - uuid: ad86434aedfa4892900cf38aafde6c16
      name: SNMP availability reported by Zabbix
      type: INTERNAL
      key: zabbix[host,snmp,available]
      delay: 1m
      description: 1 available, 0 unavailable, 2 unknown; Zabbix internal check.
      tags:
      - tag: component
        value: health
    discovery_rules:
    - uuid: 5ea99631d8b04a3fac6bbf4181826b4b
      name: Network interfaces via IF-MIB
      type: SNMP_AGENT
      snmp_oid: discovery[{#IFDESCR},1.3.6.1.2.1.2.2.1.2,{#IFADMINSTATUS},1.3.6.1.2.1.2.2.1.7]
      key: meraki.if.discovery
      delay: 1h
      description: Discover IF-MIB interfaces by index (do not assume fixed SNMP index to port number).
      filter:
        conditions:
        - macro: '{#IFDESCR}'
          value: '{$MERAKI.IF.MATCHES}'
      item_prototypes:
      - uuid: 7d0f11eb6658471aaa7969501e4c974b
        name: 'Interface {#IFDESCR}: Operational status'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.8.{#SNMPINDEX}]
        key: meraki.if.operstatus[{#SNMPINDEX}]
        delay: 2m
        valuemap:
          name: IF-MIB interface status
        tags:
        - tag: component
          value: network
      - uuid: e03e770fbde64125afa8ee15a91ab284
        name: 'Interface {#IFDESCR}: Administrative status'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.7.{#SNMPINDEX}]
        key: meraki.if.adminstatus[{#SNMPINDEX}]
        delay: 5m
        valuemap:
          name: IF-MIB admin status
        tags:
        - tag: component
          value: network
      - uuid: ae049e7972ae44bdba07215ac0af12e2
        name: 'Interface {#IFDESCR}: Incoming traffic 64-bit'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.31.1.1.1.6.{#SNMPINDEX}]
        key: meraki.if.in.hc[{#SNMPINDEX}]
        delay: 1m
        value_type: FLOAT
        units: bps
        description: IF-MIB ifHCInOctets; availability varies by model/firmware. If unsupported, use 32-bit fallback (less reliable at high speed).
        preprocessing:
        - type: CHANGE_PER_SECOND
          parameters:
          - ''
        - type: MULTIPLIER
          parameters:
          - '8'
        tags:
        - tag: component
          value: traffic
      - uuid: 1d7ef9ba0a704fe09fc78d3d3f5c4e2d
        name: 'Interface {#IFDESCR}: Outgoing traffic 64-bit'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.31.1.1.1.10.{#SNMPINDEX}]
        key: meraki.if.out.hc[{#SNMPINDEX}]
        delay: 1m
        value_type: FLOAT
        units: bps
        preprocessing:
        - type: CHANGE_PER_SECOND
          parameters:
          - ''
        - type: MULTIPLIER
          parameters:
          - '8'
        tags:
        - tag: component
          value: traffic
      - uuid: fd056fea3d9b41f0927734108acb22b2
        name: 'Interface {#IFDESCR}: Incoming traffic 32-bit fallback'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.10.{#SNMPINDEX}]
        key: meraki.if.in.legacy[{#SNMPINDEX}]
        delay: 1m
        value_type: FLOAT
        units: bps
        description: Legacy counter may wrap quickly on busy 1G/10G ports; 64-bit graph preferred when supported.
        preprocessing:
        - type: CHANGE_PER_SECOND
          parameters:
          - ''
        - type: MULTIPLIER
          parameters:
          - '8'
        tags:
        - tag: component
          value: traffic
      - uuid: a4a0ff895cb1403d9a903783e816179b
        name: 'Interface {#IFDESCR}: Outgoing traffic 32-bit fallback'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.16.{#SNMPINDEX}]
        key: meraki.if.out.legacy[{#SNMPINDEX}]
        delay: 1m
        value_type: FLOAT
        units: bps
        preprocessing:
        - type: CHANGE_PER_SECOND
          parameters:
          - ''
        - type: MULTIPLIER
          parameters:
          - '8'
        tags:
        - tag: component
          value: traffic
      - uuid: c8d49d87bdb54cd2986b1f1b44e51219
        name: 'Interface {#IFDESCR}: Input errors'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.14.{#SNMPINDEX}]
        key: meraki.if.in.errors[{#SNMPINDEX}]
        delay: 2m
        value_type: FLOAT
        units: pps
        preprocessing:
        - type: CHANGE_PER_SECOND
          parameters:
          - ''
        tags:
        - tag: component
          value: errors
      - uuid: f3fcbde5e72c4ac0a62c6ea3fa3f8e44
        name: 'Interface {#IFDESCR}: Output errors'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.20.{#SNMPINDEX}]
        key: meraki.if.out.errors[{#SNMPINDEX}]
        delay: 2m
        value_type: FLOAT
        units: pps
        preprocessing:
        - type: CHANGE_PER_SECOND
          parameters:
          - ''
        tags:
        - tag: component
          value: errors
      - uuid: 625cd4bc70374ee981666d6f47d316ef
        name: 'Interface {#IFDESCR}: Input discards'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.13.{#SNMPINDEX}]
        key: meraki.if.in.discards[{#SNMPINDEX}]
        delay: 2m
        value_type: FLOAT
        units: pps
        preprocessing:
        - type: CHANGE_PER_SECOND
          parameters:
          - ''
        tags:
        - tag: component
          value: errors
      - uuid: 67e380f2130a4b6da62c65b043d0ecc4
        name: 'Interface {#IFDESCR}: Output discards'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.19.{#SNMPINDEX}]
        key: meraki.if.out.discards[{#SNMPINDEX}]
        delay: 2m
        value_type: FLOAT
        units: pps
        preprocessing:
        - type: CHANGE_PER_SECOND
          parameters:
          - ''
        tags:
        - tag: component
          value: errors
      graph_prototypes:
      - uuid: 0163d5116fd947c492baf20d3451017e
        name: 'Interface {#IFDESCR}: Traffic 64-bit'
        graph_items:
        - color: 199C0D
          item:
            host: Cisco Meraki MS320-24P by SNMP
            key: meraki.if.in.hc[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Cisco Meraki MS320-24P by SNMP
            key: meraki.if.out.hc[{#SNMPINDEX}]
      - uuid: 000f5fcb899b4b9193267f63fff0c869
        name: 'Interface {#IFDESCR}: Traffic 32-bit fallback'
        graph_items:
        - color: 199C0D
          item:
            host: Cisco Meraki MS320-24P by SNMP
            key: meraki.if.in.legacy[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Cisco Meraki MS320-24P by SNMP
            key: meraki.if.out.legacy[{#SNMPINDEX}]
      - uuid: bd8a431246dc4aa095edd5d18b9e33d0
        name: 'Interface {#IFDESCR}: Errors and discards'
        graph_items:
        - color: 199C0D
          item:
            host: Cisco Meraki MS320-24P by SNMP
            key: meraki.if.in.errors[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Cisco Meraki MS320-24P by SNMP
            key: meraki.if.out.errors[{#SNMPINDEX}]
        - sortorder: '2'
          color: 2774A4
          item:
            host: Cisco Meraki MS320-24P by SNMP
            key: meraki.if.in.discards[{#SNMPINDEX}]
        - sortorder: '3'
          color: 8E44AD
          item:
            host: Cisco Meraki MS320-24P by SNMP
            key: meraki.if.out.discards[{#SNMPINDEX}]
      trigger_prototypes:
      - uuid: 34c75e8409a14f418df80d6817d58aee
        expression: '{$MERAKI.IF.ALERT:"{#IFDESCR}"}=1 and last(/Cisco Meraki MS320-24P by SNMP/meraki.if.operstatus[{#SNMPINDEX}])=2 and last(/Cisco Meraki MS320-24P
          by SNMP/meraki.if.adminstatus[{#SNMPINDEX}])=1'
        name: 'MS320-24P: Interface {#IFDESCR} down'
        priority: AVERAGE
        description: Opt in for critical interfaces by adding context macro {$MERAKI.IF.ALERT:"<ifDescr>"}=1 on host; otherwise default 0 avoids noisy access-port
          alerts.
        tags:
        - tag: scope
          value: availability
    macros:
    - macro: '{$MERAKI.ICMP.LOSS.WARN}'
      value: '20'
      description: ICMP loss % sustained over 5m
    - macro: '{$MERAKI.ICMP.RTT.WARN}'
      value: '0.15'
      description: Average ICMP RTT in seconds over 5m
    - macro: '{$MERAKI.IF.MATCHES}'
      value: .*
      description: Regex for interface discovery
    - macro: '{$MERAKI.IF.ALERT}'
      value: '0'
      description: Interface-down alert disabled unless context macro is set to 1 for critical interface
    valuemaps:
    - uuid: ec723f444ee845a1aa3933f7730cb723
      name: IF-MIB interface status
      mappings:
      - value: '1'
        newvalue: up
      - value: '2'
        newvalue: down
      - value: '3'
        newvalue: testing
      - value: '4'
        newvalue: unknown
      - value: '5'
        newvalue: dormant
      - value: '6'
        newvalue: notPresent
      - value: '7'
        newvalue: lowerLayerDown
    - uuid: 452989332bd94a929fa97281221ff892
      name: IF-MIB admin status
      mappings:
      - value: '1'
        newvalue: up
      - value: '2'
        newvalue: down
      - value: '3'
        newvalue: testing
