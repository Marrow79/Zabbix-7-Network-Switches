zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: 36bff6c29af64692839d077febfc7079
    name: Templates/Network devices
  templates:
  - uuid: 18fc645c808e4ce2b29f7d751eea66a6
    template: Cisco Meraki MS320-48LP by SNMP
    name: Cisco Meraki MS320-48LP by SNMP
    description: Meraki MS320-48LP-HW (MS320) local-device SNMP template for Zabbix 7.0.30. 48 nominal RJ45 front-panel port class; stated PoE budget 370 W (hardware
      spec only, NOT monitored via local SNMP). Layer 3; PoE+. SNMP polling requires Network-wide > Configure > General local SNMP, NOT the separate Meraki dashboard
      cloud SNMP endpoint. Local standard SNMPv2-MIB/IF-MIB OIDs only; no unsupported proprietary cloud-MIB device OIDs. 64-bit high capacity counters are attempted
      but may be missing on older firmware; 32-bit fallback is also provided.
    groups:
    - name: Templates/Network devices
    items:
    - uuid: 75dd6376aec54f49a3dda77f2f0340ce
      name: ICMP ping
      type: SIMPLE
      key: icmpping
      delay: 1m
      tags:
      - tag: component
        value: health
      triggers:
      - uuid: ecc3cbcff45b44e19602cb6743521b38
        expression: max(/Cisco Meraki MS320-48LP by SNMP/icmpping,#3)=0
        name: 'MS320-48LP: Unavailable by ICMP'
        priority: HIGH
        description: Device failed three consecutive ICMP checks.
        tags:
        - tag: scope
          value: availability
    - uuid: 2c860564c61647b098012f38e6bb9479
      name: ICMP packet loss
      type: SIMPLE
      key: icmppingloss
      delay: 1m
      value_type: FLOAT
      units: '%'
      tags:
      - tag: component
        value: health
      triggers:
      - uuid: abf8a333f62e46d5962ed43533b79f5d
        expression: min(/Cisco Meraki MS320-48LP by SNMP/icmppingloss,5m)>{$MERAKI.ICMP.LOSS.WARN} and min(/Cisco Meraki MS320-48LP by SNMP/icmppingloss,5m)<100
        name: 'MS320-48LP: High packet loss'
        priority: WARNING
        description: Packet loss exceeds macro threshold for five minutes.
        tags:
        - tag: scope
          value: performance
    - uuid: ddaf2c868c244ce9a3e7676244027e1c
      name: ICMP response time
      type: SIMPLE
      key: icmppingsec
      delay: 1m
      value_type: FLOAT
      units: s
      tags:
      - tag: component
        value: health
      triggers:
      - uuid: 0b635bafb65c4b7c9dd489c7b490395e
        expression: avg(/Cisco Meraki MS320-48LP by SNMP/icmppingsec,5m)>{$MERAKI.ICMP.RTT.WARN}
        name: 'MS320-48LP: High ICMP RTT'
        priority: WARNING
        description: Average response time exceeds macro threshold for five minutes.
        tags:
        - tag: scope
          value: performance
    - uuid: 1b6f8f5cb9f4423eba9d90ebade397c7
      name: SNMP sysUpTime
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.3.0]
      key: meraki.sys.uptime
      delay: 1m
      units: uptime
      description: SNMP agent uptime in seconds; sysUpTime Timeticks converted /100. Not hardware uptime.
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: component
        value: health
      triggers:
      - uuid: b3b71cac231d45e9b48d8a11e638043c
        expression: nodata(/Cisco Meraki MS320-48LP by SNMP/meraki.sys.uptime,15m)=1 and last(/Cisco Meraki MS320-48LP by SNMP/icmpping)=1
        name: 'MS320-48LP: SNMP stopped responding'
        priority: AVERAGE
        description: ICMP works but sysUpTime stopped updating. Check local device SNMP and credentials.
        tags:
        - tag: scope
          value: availability
    - uuid: 26b50b4bd27d486488c2009cd58dc57a
      name: System description
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.1.0]
      key: meraki.sys.description
      delay: 1h
      value_type: CHAR
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 12h
      tags:
      - tag: component
        value: inventory
    - uuid: c26fc66f88c84f00ada2aaa094b2bc03
      name: System name
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.5.0]
      key: meraki.sys.name
      delay: 1h
      value_type: CHAR
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 12h
      tags:
      - tag: component
        value: inventory
    - uuid: c69f0e9019354d5a992d467fe4f95f7f
      name: System object ID
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.2.0]
      key: meraki.sys.objectid
      delay: 1h
      value_type: CHAR
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 12h
      tags:
      - tag: component
        value: inventory
    - uuid: 4bcd1774c1294cb4952c4c82645c2174
      name: System contact
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.4.0]
      key: meraki.sys.contact
      delay: 1h
      value_type: CHAR
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 12h
      tags:
      - tag: component
        value: inventory
    - uuid: 0637f6ebb128456cb8ae82cdb2427260
      name: System location
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.6.0]
      key: meraki.sys.location
      delay: 1h
      value_type: CHAR
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 12h
      tags:
      - tag: component
        value: inventory
    - uuid: 89a14adb44954bd88afb6f578c61c121
      name: SNMP availability reported by Zabbix
      type: INTERNAL
      key: zabbix[host,snmp,available]
      delay: 1m
      description: 1 available, 0 unavailable, 2 unknown; Zabbix internal check.
      tags:
      - tag: component
        value: health
    discovery_rules:
    - uuid: 1c4d39313eee4a5ea149425d957e44be
      name: Network interfaces via IF-MIB
      type: SNMP_AGENT
      snmp_oid: discovery[{#IFDESCR},1.3.6.1.2.1.2.2.1.2,{#IFADMINSTATUS},1.3.6.1.2.1.2.2.1.7]
      key: meraki.if.discovery
      delay: 1h
      description: Discover IF-MIB interfaces by index (do not assume fixed SNMP index to port number).
      filter:
        conditions:
        - macro: '{#IFDESCR}'
          value: '{$MERAKI.IF.MATCHES}'
      item_prototypes:
      - uuid: f18074c6e7dd41149c919aa46f7287f5
        name: 'Interface {#IFDESCR}: Operational status'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.8.{#SNMPINDEX}]
        key: meraki.if.operstatus[{#SNMPINDEX}]
        delay: 2m
        valuemap:
          name: IF-MIB interface status
        tags:
        - tag: component
          value: network
      - uuid: 26e78eb9b1674cecb0d47e1e8657ea6c
        name: 'Interface {#IFDESCR}: Administrative status'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.7.{#SNMPINDEX}]
        key: meraki.if.adminstatus[{#SNMPINDEX}]
        delay: 5m
        valuemap:
          name: IF-MIB admin status
        tags:
        - tag: component
          value: network
      - uuid: 3e1885faa8f747cab63f42920cf1af02
        name: 'Interface {#IFDESCR}: Incoming traffic 64-bit'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.31.1.1.1.6.{#SNMPINDEX}]
        key: meraki.if.in.hc[{#SNMPINDEX}]
        delay: 1m
        value_type: FLOAT
        units: bps
        description: IF-MIB ifHCInOctets; availability varies by model/firmware. If unsupported, use 32-bit fallback (less reliable at high speed).
        preprocessing:
        - type: CHANGE_PER_SECOND
          parameters:
          - ''
        - type: MULTIPLIER
          parameters:
          - '8'
        tags:
        - tag: component
          value: traffic
      - uuid: e1ad2a1625284e73be7ac57ee0a0a27a
        name: 'Interface {#IFDESCR}: Outgoing traffic 64-bit'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.31.1.1.1.10.{#SNMPINDEX}]
        key: meraki.if.out.hc[{#SNMPINDEX}]
        delay: 1m
        value_type: FLOAT
        units: bps
        preprocessing:
        - type: CHANGE_PER_SECOND
          parameters:
          - ''
        - type: MULTIPLIER
          parameters:
          - '8'
        tags:
        - tag: component
          value: traffic
      - uuid: d5052fbddbdc4dbdb5c6672cde7239a5
        name: 'Interface {#IFDESCR}: Incoming traffic 32-bit fallback'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.10.{#SNMPINDEX}]
        key: meraki.if.in.legacy[{#SNMPINDEX}]
        delay: 1m
        value_type: FLOAT
        units: bps
        description: Legacy counter may wrap quickly on busy 1G/10G ports; 64-bit graph preferred when supported.
        preprocessing:
        - type: CHANGE_PER_SECOND
          parameters:
          - ''
        - type: MULTIPLIER
          parameters:
          - '8'
        tags:
        - tag: component
          value: traffic
      - uuid: 8098912596e4443d8b4e5c3788d19204
        name: 'Interface {#IFDESCR}: Outgoing traffic 32-bit fallback'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.16.{#SNMPINDEX}]
        key: meraki.if.out.legacy[{#SNMPINDEX}]
        delay: 1m
        value_type: FLOAT
        units: bps
        preprocessing:
        - type: CHANGE_PER_SECOND
          parameters:
          - ''
        - type: MULTIPLIER
          parameters:
          - '8'
        tags:
        - tag: component
          value: traffic
      - uuid: 1ad826d623fd46c6ab30dd7c9757836c
        name: 'Interface {#IFDESCR}: Input errors'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.14.{#SNMPINDEX}]
        key: meraki.if.in.errors[{#SNMPINDEX}]
        delay: 2m
        value_type: FLOAT
        units: pps
        preprocessing:
        - type: CHANGE_PER_SECOND
          parameters:
          - ''
        tags:
        - tag: component
          value: errors
      - uuid: cb39d9aeeb704ce88b5c6e0e722f04a9
        name: 'Interface {#IFDESCR}: Output errors'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.20.{#SNMPINDEX}]
        key: meraki.if.out.errors[{#SNMPINDEX}]
        delay: 2m
        value_type: FLOAT
        units: pps
        preprocessing:
        - type: CHANGE_PER_SECOND
          parameters:
          - ''
        tags:
        - tag: component
          value: errors
      - uuid: f0b0b8ad60a944438f40e3bd29ea80c5
        name: 'Interface {#IFDESCR}: Input discards'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.13.{#SNMPINDEX}]
        key: meraki.if.in.discards[{#SNMPINDEX}]
        delay: 2m
        value_type: FLOAT
        units: pps
        preprocessing:
        - type: CHANGE_PER_SECOND
          parameters:
          - ''
        tags:
        - tag: component
          value: errors
      - uuid: 571fd4e722b54de590029a011364cbc8
        name: 'Interface {#IFDESCR}: Output discards'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.19.{#SNMPINDEX}]
        key: meraki.if.out.discards[{#SNMPINDEX}]
        delay: 2m
        value_type: FLOAT
        units: pps
        preprocessing:
        - type: CHANGE_PER_SECOND
          parameters:
          - ''
        tags:
        - tag: component
          value: errors
      graph_prototypes:
      - uuid: fc767c3aeace4cf7a2ba9225004ab916
        name: 'Interface {#IFDESCR}: Traffic 64-bit'
        graph_items:
        - color: 199C0D
          item:
            host: Cisco Meraki MS320-48LP by SNMP
            key: meraki.if.in.hc[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Cisco Meraki MS320-48LP by SNMP
            key: meraki.if.out.hc[{#SNMPINDEX}]
      - uuid: 0ec87e4ed39c4532a1c23b71b8385f09
        name: 'Interface {#IFDESCR}: Traffic 32-bit fallback'
        graph_items:
        - color: 199C0D
          item:
            host: Cisco Meraki MS320-48LP by SNMP
            key: meraki.if.in.legacy[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Cisco Meraki MS320-48LP by SNMP
            key: meraki.if.out.legacy[{#SNMPINDEX}]
      - uuid: bc5fe8dc0c224eb59a3fb9f7ba407771
        name: 'Interface {#IFDESCR}: Errors and discards'
        graph_items:
        - color: 199C0D
          item:
            host: Cisco Meraki MS320-48LP by SNMP
            key: meraki.if.in.errors[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Cisco Meraki MS320-48LP by SNMP
            key: meraki.if.out.errors[{#SNMPINDEX}]
        - sortorder: '2'
          color: 2774A4
          item:
            host: Cisco Meraki MS320-48LP by SNMP
            key: meraki.if.in.discards[{#SNMPINDEX}]
        - sortorder: '3'
          color: 8E44AD
          item:
            host: Cisco Meraki MS320-48LP by SNMP
            key: meraki.if.out.discards[{#SNMPINDEX}]
      trigger_prototypes:
      - uuid: b5ab6d06ba364c5ab6ff06a68ca7988b
        expression: '{$MERAKI.IF.ALERT:"{#IFDESCR}"}=1 and last(/Cisco Meraki MS320-48LP by SNMP/meraki.if.operstatus[{#SNMPINDEX}])=2 and last(/Cisco Meraki MS320-48LP
          by SNMP/meraki.if.adminstatus[{#SNMPINDEX}])=1'
        name: 'MS320-48LP: Interface {#IFDESCR} down'
        priority: AVERAGE
        description: Opt in for critical interfaces by adding context macro {$MERAKI.IF.ALERT:"<ifDescr>"}=1 on host; otherwise default 0 avoids noisy access-port
          alerts.
        tags:
        - tag: scope
          value: availability
    macros:
    - macro: '{$MERAKI.ICMP.LOSS.WARN}'
      value: '20'
      description: ICMP loss % sustained over 5m
    - macro: '{$MERAKI.ICMP.RTT.WARN}'
      value: '0.15'
      description: Average ICMP RTT in seconds over 5m
    - macro: '{$MERAKI.IF.MATCHES}'
      value: .*
      description: Regex for interface discovery
    - macro: '{$MERAKI.IF.ALERT}'
      value: '0'
      description: Interface-down alert disabled unless context macro is set to 1 for critical interface
    valuemaps:
    - uuid: 880532bbf699470dbc6c160b61a8b98a
      name: IF-MIB interface status
      mappings:
      - value: '1'
        newvalue: up
      - value: '2'
        newvalue: down
      - value: '3'
        newvalue: testing
      - value: '4'
        newvalue: unknown
      - value: '5'
        newvalue: dormant
      - value: '6'
        newvalue: notPresent
      - value: '7'
        newvalue: lowerLayerDown
    - uuid: 796fa037520d4e2ca454a0d2b20d23e5
      name: IF-MIB admin status
      mappings:
      - value: '1'
        newvalue: up
      - value: '2'
        newvalue: down
      - value: '3'
        newvalue: testing
