zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: 09f886ad403040baac472e7e0b04ba29
    name: Templates/Network devices/Switches
  templates:
  - uuid: 8279b92f5f8548b5a62f35f7cc73ac82
    template: Cisco C1300-24FP-4X by SNMP
    name: Cisco C1300-24FP-4X by SNMP
    description: 'Zabbix 7.0 template for Cisco C1300-24FP-4X.


      Uses vendor-neutral standard SNMP objects so the template is safe across firmware revisions: SNMPv2-MIB/MIB-II for system identity and uptime,
      plus IF-MIB for interface discovery, status, speed, traffic, errors and discards.


      The switch must have SNMP enabled and a matching SNMP interface configured on the Zabbix host. Vendor-private OIDs are intentionally not
      guessed. Models/families in this package were included only where SNMP support was verified at the product, family, or network-OS level.'
    vendor:
      name: OpenAI generated
      version: 7.0-1
    groups:
    - name: Templates/Network devices/Switches
    tags:
    - tag: class
      value: network switch
    - tag: manufacturer
      value: Cisco
    - tag: model
      value: C1300-24FP-4X
    items:
    - uuid: e794b2e891f44ea28ed6e88e33ae0a95
      name: SNMP availability
      type: INTERNAL
      key: zabbix[host,snmp,available]
      delay: 1m
      history: 7d
      valuemap:
        name: 'Cisco C1300-24FP-4X: Zabbix SNMP availability'
      tags:
      - tag: component
        value: availability
      triggers:
      - uuid: b5a45e5a6fc74217b710a5e7095c7f1d
        expression: max(/Cisco C1300-24FP-4X by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0
        name: 'C1300-24FP-4X: No SNMP data collection'
        priority: HIGH
        description: Zabbix cannot poll this switch over SNMP.
    - uuid: 89f70ac044464361ab5d3c4b07d736e2
      name: System description
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.1.0
      key: switch.sysdescr
      delay: 1h
      history: 30d
      tags:
      - tag: component
        value: inventory
      trends: '0'
      value_type: TEXT
    - uuid: da4e59d653d14f41a8607a408bc215d1
      name: System object ID
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.2.0
      key: switch.sysobjectid
      delay: 1h
      history: 30d
      tags:
      - tag: component
        value: inventory
      trends: '0'
      value_type: CHAR
    - uuid: d882cf2380dc478083a511f755fa9e62
      name: System name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.5.0
      key: switch.sysname
      delay: 10m
      history: 30d
      tags:
      - tag: component
        value: inventory
      trends: '0'
      value_type: CHAR
    - uuid: e6d7f08696f84e3cad56ec93509f3b13
      name: System location
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.6.0
      key: switch.syslocation
      delay: 1h
      history: 30d
      tags:
      - tag: component
        value: inventory
      trends: '0'
      value_type: CHAR
    - uuid: 3d4e64a4316a445a8795d50846d16bcc
      name: System contact
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.4.0
      key: switch.syscontact
      delay: 1h
      history: 30d
      tags:
      - tag: component
        value: inventory
      trends: '0'
      value_type: CHAR
    - uuid: 00891ce36fc94a6d90209faf186b57fd
      name: Number of interfaces
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.2.1.0
      key: switch.interfaces.count
      delay: 10m
      history: 30d
      tags:
      - tag: component
        value: interfaces
    - uuid: ea78526719534292ae458406fe31a4fa
      name: System uptime
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.3.0
      key: switch.uptime
      delay: 5m
      history: 30d
      units: uptime
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: component
        value: system
    discovery_rules:
    - uuid: 05dd2ed4ac1c41a08aa643ed941f60c9
      name: Network interface discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#IFOPERSTATUS},1.3.6.1.2.1.2.2.1.8,{#IFADMINSTATUS},1.3.6.1.2.1.2.2.1.7,{#IFNAME},1.3.6.1.2.1.31.1.1.1.1,{#IFDESCR},1.3.6.1.2.1.2.2.1.2,{#IFTYPE},1.3.6.1.2.1.2.2.1.3,{#IFALIAS},1.3.6.1.2.1.31.1.1.1.18]
      key: net.if.discovery
      delay: 1h
      lifetime: 7d
      item_prototypes:
      - uuid: 3124f398e70d4da094a5d39868003777
        name: 'Interface {#IFNAME}: Administrative status'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.2.2.1.7.{#SNMPINDEX}
        key: net.if.admin[{#SNMPINDEX}]
        delay: 1m
        history: 30d
        tags:
        - tag: component
          value: interface
        - tag: interface
          value: '{#IFNAME}'
        valuemap:
          name: 'Cisco C1300-24FP-4X: IF-MIB ifAdminStatus'
      - uuid: bbda32e6421042c3ae7fc39d53630ea8
        name: 'Interface {#IFNAME}: Operational status'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.2.2.1.8.{#SNMPINDEX}
        key: net.if.oper[{#SNMPINDEX}]
        delay: 1m
        history: 30d
        tags:
        - tag: component
          value: interface
        - tag: interface
          value: '{#IFNAME}'
        valuemap:
          name: 'Cisco C1300-24FP-4X: IF-MIB ifOperStatus'
      - uuid: d0142e0803794d86b8801cd90bf68e7c
        name: 'Interface {#IFNAME}: Alias'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.31.1.1.1.18.{#SNMPINDEX}
        key: net.if.alias[{#SNMPINDEX}]
        delay: 1m
        history: 30d
        tags:
        - tag: component
          value: interface
        - tag: interface
          value: '{#IFNAME}'
        value_type: CHAR
      - uuid: 42c1fcd6144d4ee38533631ee107ef0d
        name: 'Interface {#IFNAME}: Speed'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.31.1.1.1.15.{#SNMPINDEX}
        key: net.if.speed[{#SNMPINDEX}]
        delay: 1m
        history: 30d
        tags:
        - tag: component
          value: interface
        - tag: interface
          value: '{#IFNAME}'
        units: Mbit/s
      - uuid: 9c578ed1e0dc464b9620d8abfc30362d
        name: 'Interface {#IFNAME}: Inbound traffic'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.31.1.1.1.6.{#SNMPINDEX}
        key: net.if.in.bps[{#SNMPINDEX}]
        delay: 1m
        history: 30d
        tags:
        - tag: component
          value: traffic
        - tag: interface
          value: '{#IFNAME}'
        value_type: FLOAT
        units: bps
        preprocessing: &id001
        - type: CHANGE_PER_SECOND
          parameters:
          - ''
        - type: MULTIPLIER
          parameters:
          - '8'
      - uuid: 1620f2704aec4685814aaa536f98f34d
        name: 'Interface {#IFNAME}: Outbound traffic'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.31.1.1.1.10.{#SNMPINDEX}
        key: net.if.out.bps[{#SNMPINDEX}]
        delay: 1m
        history: 30d
        tags:
        - tag: component
          value: traffic
        - tag: interface
          value: '{#IFNAME}'
        value_type: FLOAT
        units: bps
        preprocessing: *id001
      - uuid: 7ef6f88f27834741a1a93a1d4ca61f34
        name: 'Interface {#IFNAME}: Inbound errors/sec'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.2.2.1.14.{#SNMPINDEX}
        key: net.if.in.errors[{#SNMPINDEX}]
        delay: 1m
        history: 30d
        tags:
        - tag: component
          value: errors
        - tag: interface
          value: '{#IFNAME}'
        value_type: FLOAT
        preprocessing: &id002
        - type: CHANGE_PER_SECOND
          parameters:
          - ''
      - uuid: 811f1c32ec84495f84c6a2139452b56c
        name: 'Interface {#IFNAME}: Outbound errors/sec'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.2.2.1.20.{#SNMPINDEX}
        key: net.if.out.errors[{#SNMPINDEX}]
        delay: 1m
        history: 30d
        tags:
        - tag: component
          value: errors
        - tag: interface
          value: '{#IFNAME}'
        value_type: FLOAT
        preprocessing: *id002
      - uuid: c7127b6dac1d448fb9057783b553c91f
        name: 'Interface {#IFNAME}: Inbound discards/sec'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.2.2.1.13.{#SNMPINDEX}
        key: net.if.in.discards[{#SNMPINDEX}]
        delay: 1m
        history: 30d
        tags:
        - tag: component
          value: errors
        - tag: interface
          value: '{#IFNAME}'
        value_type: FLOAT
        preprocessing: *id002
      - uuid: a19080095d6747948ba8ad18c3762292
        name: 'Interface {#IFNAME}: Outbound discards/sec'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.2.2.1.19.{#SNMPINDEX}
        key: net.if.out.discards[{#SNMPINDEX}]
        delay: 1m
        history: 30d
        tags:
        - tag: component
          value: errors
        - tag: interface
          value: '{#IFNAME}'
        value_type: FLOAT
        preprocessing: *id002
      graph_prototypes:
      - uuid: a0bdcd4664214cc4a053cf016ca59300
        name: 'Interface {#IFNAME}: Traffic'
        graph_items:
        - color: 199C0D
          item:
            host: Cisco C1300-24FP-4X by SNMP
            key: net.if.in.bps[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Cisco C1300-24FP-4X by SNMP
            key: net.if.out.bps[{#SNMPINDEX}]
      - uuid: 7c5c3df656cd4110a0e0f831286528ca
        name: 'Interface {#IFNAME}: Errors and discards'
        graph_items:
        - color: F63100
          item:
            host: Cisco C1300-24FP-4X by SNMP
            key: net.if.in.errors[{#SNMPINDEX}]
        - sortorder: '1'
          color: A54F10
          item:
            host: Cisco C1300-24FP-4X by SNMP
            key: net.if.out.errors[{#SNMPINDEX}]
        - sortorder: '2'
          color: 2774A4
          item:
            host: Cisco C1300-24FP-4X by SNMP
            key: net.if.in.discards[{#SNMPINDEX}]
        - sortorder: '3'
          color: 6C59DC
          item:
            host: Cisco C1300-24FP-4X by SNMP
            key: net.if.out.discards[{#SNMPINDEX}]
    macros:
    - macro: '{$SNMP.TIMEOUT}'
      value: 5m
      description: Time without successful SNMP polling before the availability trigger fires.
    valuemaps:
    - uuid: 38a7e2dd9dfb4c6ebf14a59c41f20e94
      name: 'Cisco C1300-24FP-4X: Zabbix SNMP availability'
      mappings:
      - value: '0'
        newvalue: Not available
      - value: '1'
        newvalue: Available
      - value: '2'
        newvalue: Unknown
    - uuid: 32429a1831cb4ec489ee5cc6d5ed1eee
      name: 'Cisco C1300-24FP-4X: IF-MIB ifAdminStatus'
      mappings:
      - value: '1'
        newvalue: Up
      - value: '2'
        newvalue: Down
      - value: '3'
        newvalue: Testing
    - uuid: 0d31c56a3f9546b3abb70a2537f5e0e8
      name: 'Cisco C1300-24FP-4X: IF-MIB ifOperStatus'
      mappings:
      - value: '1'
        newvalue: Up
      - value: '2'
        newvalue: Down
      - value: '3'
        newvalue: Testing
      - value: '4'
        newvalue: Unknown
      - value: '5'
        newvalue: Dormant
      - value: '6'
        newvalue: Not present
      - value: '7'
        newvalue: Lower layer down
