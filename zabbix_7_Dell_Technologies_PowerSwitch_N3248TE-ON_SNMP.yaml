zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: 09f886ad403040baac472e7e0b04ba29
    name: Templates/Network devices/Switches
  templates:
  - uuid: 4ba0894faf89431da1649e721b321b04
    template: Dell Technologies PowerSwitch N3248TE-ON by SNMP
    name: Dell Technologies PowerSwitch N3248TE-ON by SNMP
    description: 'Zabbix 7.0 template for Dell Technologies PowerSwitch N3248TE-ON.


      Uses vendor-neutral standard SNMP objects so the template is safe across firmware revisions: SNMPv2-MIB/MIB-II for system identity and uptime,
      plus IF-MIB for interface discovery, status, speed, traffic, errors and discards.


      The switch must have SNMP enabled and a matching SNMP interface configured on the Zabbix host. Vendor-private OIDs are intentionally not
      guessed. Models/families in this package were included only where SNMP support was verified at the product, family, or network-OS level.'
    vendor:
      name: OpenAI generated
      version: 7.0-1
    groups:
    - name: Templates/Network devices/Switches
    tags:
    - tag: class
      value: network switch
    - tag: manufacturer
      value: Dell Technologies
    - tag: model
      value: PowerSwitch N3248TE-ON
    items:
    - uuid: 40fa85324d8240a6924f087002b77219
      name: SNMP availability
      type: INTERNAL
      key: zabbix[host,snmp,available]
      delay: 1m
      history: 7d
      valuemap:
        name: 'Dell Technologies PowerSwitch N3248TE-ON: Zabbix SNMP availability'
      tags:
      - tag: component
        value: availability
      triggers:
      - uuid: c77109c2cd954a0ea3d34c4b8f283cf0
        expression: max(/Dell Technologies PowerSwitch N3248TE-ON by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0
        name: 'PowerSwitch N3248TE-ON: No SNMP data collection'
        priority: HIGH
        description: Zabbix cannot poll this switch over SNMP.
    - uuid: ef1048ab26d747308b684e70c656dd51
      name: System description
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.1.0
      key: switch.sysdescr
      delay: 1h
      history: 30d
      tags:
      - tag: component
        value: inventory
      trends: '0'
      value_type: TEXT
    - uuid: d7f2b6dbedb042c9a97aa964de09cdb0
      name: System object ID
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.2.0
      key: switch.sysobjectid
      delay: 1h
      history: 30d
      tags:
      - tag: component
        value: inventory
      trends: '0'
      value_type: CHAR
    - uuid: 3863854d2d8840b79537c74507e4fb89
      name: System name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.5.0
      key: switch.sysname
      delay: 10m
      history: 30d
      tags:
      - tag: component
        value: inventory
      trends: '0'
      value_type: CHAR
    - uuid: dfa41d01b1fe4076a7c69b71f650b881
      name: System location
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.6.0
      key: switch.syslocation
      delay: 1h
      history: 30d
      tags:
      - tag: component
        value: inventory
      trends: '0'
      value_type: CHAR
    - uuid: 6f2fdf877e1f4c248a6d1ac260bf0a00
      name: System contact
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.4.0
      key: switch.syscontact
      delay: 1h
      history: 30d
      tags:
      - tag: component
        value: inventory
      trends: '0'
      value_type: CHAR
    - uuid: 24b1071fae0b433e9afb608aa721f84f
      name: Number of interfaces
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.2.1.0
      key: switch.interfaces.count
      delay: 10m
      history: 30d
      tags:
      - tag: component
        value: interfaces
    - uuid: 3b65f27f072845508eb62291a6ee57de
      name: System uptime
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.3.0
      key: switch.uptime
      delay: 5m
      history: 30d
      units: uptime
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: component
        value: system
    discovery_rules:
    - uuid: f2ab4e4ebc74403185e167cc63dab1c2
      name: Network interface discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#IFOPERSTATUS},1.3.6.1.2.1.2.2.1.8,{#IFADMINSTATUS},1.3.6.1.2.1.2.2.1.7,{#IFNAME},1.3.6.1.2.1.31.1.1.1.1,{#IFDESCR},1.3.6.1.2.1.2.2.1.2,{#IFTYPE},1.3.6.1.2.1.2.2.1.3,{#IFALIAS},1.3.6.1.2.1.31.1.1.1.18]
      key: net.if.discovery
      delay: 1h
      lifetime: 7d
      item_prototypes:
      - uuid: a8d8adef4fc94b6ebd34d68fb85a972a
        name: 'Interface {#IFNAME}: Administrative status'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.2.2.1.7.{#SNMPINDEX}
        key: net.if.admin[{#SNMPINDEX}]
        delay: 1m
        history: 30d
        tags:
        - tag: component
          value: interface
        - tag: interface
          value: '{#IFNAME}'
        valuemap:
          name: 'Dell Technologies PowerSwitch N3248TE-ON: IF-MIB ifAdminStatus'
      - uuid: 0489b46985a04b5592d62aaadd5ec6dd
        name: 'Interface {#IFNAME}: Operational status'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.2.2.1.8.{#SNMPINDEX}
        key: net.if.oper[{#SNMPINDEX}]
        delay: 1m
        history: 30d
        tags:
        - tag: component
          value: interface
        - tag: interface
          value: '{#IFNAME}'
        valuemap:
          name: 'Dell Technologies PowerSwitch N3248TE-ON: IF-MIB ifOperStatus'
      - uuid: ce5811f4f8ec4d5a888f88a5fe011c3c
        name: 'Interface {#IFNAME}: Alias'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.31.1.1.1.18.{#SNMPINDEX}
        key: net.if.alias[{#SNMPINDEX}]
        delay: 1m
        history: 30d
        tags:
        - tag: component
          value: interface
        - tag: interface
          value: '{#IFNAME}'
        value_type: CHAR
      - uuid: eec14f85708742219cd5466013fd9d5e
        name: 'Interface {#IFNAME}: Speed'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.31.1.1.1.15.{#SNMPINDEX}
        key: net.if.speed[{#SNMPINDEX}]
        delay: 1m
        history: 30d
        tags:
        - tag: component
          value: interface
        - tag: interface
          value: '{#IFNAME}'
        units: Mbit/s
      - uuid: f4c331acd7234e608bed710e2d343022
        name: 'Interface {#IFNAME}: Inbound traffic'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.31.1.1.1.6.{#SNMPINDEX}
        key: net.if.in.bps[{#SNMPINDEX}]
        delay: 1m
        history: 30d
        tags:
        - tag: component
          value: traffic
        - tag: interface
          value: '{#IFNAME}'
        value_type: FLOAT
        units: bps
        preprocessing: &id001
        - type: CHANGE_PER_SECOND
          parameters:
          - ''
        - type: MULTIPLIER
          parameters:
          - '8'
      - uuid: 1bb1b0c55a304be49b8a1496f1bad460
        name: 'Interface {#IFNAME}: Outbound traffic'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.31.1.1.1.10.{#SNMPINDEX}
        key: net.if.out.bps[{#SNMPINDEX}]
        delay: 1m
        history: 30d
        tags:
        - tag: component
          value: traffic
        - tag: interface
          value: '{#IFNAME}'
        value_type: FLOAT
        units: bps
        preprocessing: *id001
      - uuid: 3f30ef4d6cf7463f9376029b277cbe19
        name: 'Interface {#IFNAME}: Inbound errors/sec'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.2.2.1.14.{#SNMPINDEX}
        key: net.if.in.errors[{#SNMPINDEX}]
        delay: 1m
        history: 30d
        tags:
        - tag: component
          value: errors
        - tag: interface
          value: '{#IFNAME}'
        value_type: FLOAT
        preprocessing: &id002
        - type: CHANGE_PER_SECOND
          parameters:
          - ''
      - uuid: 294bd363bfbd42bfb4343bab837e984b
        name: 'Interface {#IFNAME}: Outbound errors/sec'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.2.2.1.20.{#SNMPINDEX}
        key: net.if.out.errors[{#SNMPINDEX}]
        delay: 1m
        history: 30d
        tags:
        - tag: component
          value: errors
        - tag: interface
          value: '{#IFNAME}'
        value_type: FLOAT
        preprocessing: *id002
      - uuid: ed5c0f9c4d224bfbb146531f9ca8e4d5
        name: 'Interface {#IFNAME}: Inbound discards/sec'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.2.2.1.13.{#SNMPINDEX}
        key: net.if.in.discards[{#SNMPINDEX}]
        delay: 1m
        history: 30d
        tags:
        - tag: component
          value: errors
        - tag: interface
          value: '{#IFNAME}'
        value_type: FLOAT
        preprocessing: *id002
      - uuid: 73ad2b4c503945e5b4a5a57caa998104
        name: 'Interface {#IFNAME}: Outbound discards/sec'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.2.2.1.19.{#SNMPINDEX}
        key: net.if.out.discards[{#SNMPINDEX}]
        delay: 1m
        history: 30d
        tags:
        - tag: component
          value: errors
        - tag: interface
          value: '{#IFNAME}'
        value_type: FLOAT
        preprocessing: *id002
      graph_prototypes:
      - uuid: f2e4926eee4a4718b948fa61ab98a449
        name: 'Interface {#IFNAME}: Traffic'
        graph_items:
        - color: 199C0D
          item:
            host: Dell Technologies PowerSwitch N3248TE-ON by SNMP
            key: net.if.in.bps[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Dell Technologies PowerSwitch N3248TE-ON by SNMP
            key: net.if.out.bps[{#SNMPINDEX}]
      - uuid: 2a4d6ca9b4284c93985e502268552cb2
        name: 'Interface {#IFNAME}: Errors and discards'
        graph_items:
        - color: F63100
          item:
            host: Dell Technologies PowerSwitch N3248TE-ON by SNMP
            key: net.if.in.errors[{#SNMPINDEX}]
        - sortorder: '1'
          color: A54F10
          item:
            host: Dell Technologies PowerSwitch N3248TE-ON by SNMP
            key: net.if.out.errors[{#SNMPINDEX}]
        - sortorder: '2'
          color: 2774A4
          item:
            host: Dell Technologies PowerSwitch N3248TE-ON by SNMP
            key: net.if.in.discards[{#SNMPINDEX}]
        - sortorder: '3'
          color: 6C59DC
          item:
            host: Dell Technologies PowerSwitch N3248TE-ON by SNMP
            key: net.if.out.discards[{#SNMPINDEX}]
    macros:
    - macro: '{$SNMP.TIMEOUT}'
      value: 5m
      description: Time without successful SNMP polling before the availability trigger fires.
    valuemaps:
    - uuid: 5b54ec46211c4d84a902182034564b71
      name: 'Dell Technologies PowerSwitch N3248TE-ON: Zabbix SNMP availability'
      mappings:
      - value: '0'
        newvalue: Not available
      - value: '1'
        newvalue: Available
      - value: '2'
        newvalue: Unknown
    - uuid: 257edeb642654ec7a6f50dc0ab986aee
      name: 'Dell Technologies PowerSwitch N3248TE-ON: IF-MIB ifAdminStatus'
      mappings:
      - value: '1'
        newvalue: Up
      - value: '2'
        newvalue: Down
      - value: '3'
        newvalue: Testing
    - uuid: 4d0ac52333cb43f68534baa817231922
      name: 'Dell Technologies PowerSwitch N3248TE-ON: IF-MIB ifOperStatus'
      mappings:
      - value: '1'
        newvalue: Up
      - value: '2'
        newvalue: Down
      - value: '3'
        newvalue: Testing
      - value: '4'
        newvalue: Unknown
      - value: '5'
        newvalue: Dormant
      - value: '6'
        newvalue: Not present
      - value: '7'
        newvalue: Lower layer down
