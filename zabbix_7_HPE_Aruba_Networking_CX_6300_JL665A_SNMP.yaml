zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: 09f886ad403040baac472e7e0b04ba29
    name: Templates/Network devices/Switches
  templates:
  - uuid: 18863c315d6b4856b7bac7d07a7e4fc6
    template: HPE Aruba Networking CX 6300 JL665A by SNMP
    name: HPE Aruba Networking CX 6300 JL665A by SNMP
    description: 'Zabbix 7.0 template for HPE Aruba Networking CX 6300 JL665A.


      Uses vendor-neutral standard SNMP objects so the template is safe across firmware revisions: SNMPv2-MIB/MIB-II for system identity and uptime,
      plus IF-MIB for interface discovery, status, speed, traffic, errors and discards.


      The switch must have SNMP enabled and a matching SNMP interface configured on the Zabbix host. Vendor-private OIDs are intentionally not
      guessed. Models/families in this package were included only where SNMP support was verified at the product, family, or network-OS level.'
    vendor:
      name: OpenAI generated
      version: 7.0-1
    groups:
    - name: Templates/Network devices/Switches
    tags:
    - tag: class
      value: network switch
    - tag: manufacturer
      value: HPE Aruba Networking
    - tag: model
      value: CX 6300 JL665A
    items:
    - uuid: dddb4d5893a74d48babd03203527dc44
      name: SNMP availability
      type: INTERNAL
      key: zabbix[host,snmp,available]
      delay: 1m
      history: 7d
      valuemap:
        name: 'HPE Aruba Networking CX 6300 JL665A: Zabbix SNMP availability'
      tags:
      - tag: component
        value: availability
      triggers:
      - uuid: 7bbb6b17cb42441bbd8c1fb32b95b5fa
        expression: max(/HPE Aruba Networking CX 6300 JL665A by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0
        name: 'CX 6300 JL665A: No SNMP data collection'
        priority: HIGH
        description: Zabbix cannot poll this switch over SNMP.
    - uuid: 48a56aee7ac446108790d5aaf92be2a0
      name: System description
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.1.0
      key: switch.sysdescr
      delay: 1h
      history: 30d
      tags:
      - tag: component
        value: inventory
      trends: '0'
      value_type: TEXT
    - uuid: c43c5dc65f8c4094ae3e599ef3702e6d
      name: System object ID
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.2.0
      key: switch.sysobjectid
      delay: 1h
      history: 30d
      tags:
      - tag: component
        value: inventory
      trends: '0'
      value_type: CHAR
    - uuid: 511719ce9db741539a67e0d7d63fbc16
      name: System name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.5.0
      key: switch.sysname
      delay: 10m
      history: 30d
      tags:
      - tag: component
        value: inventory
      trends: '0'
      value_type: CHAR
    - uuid: 94de2a2785b64015b7f48de9685a8a10
      name: System location
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.6.0
      key: switch.syslocation
      delay: 1h
      history: 30d
      tags:
      - tag: component
        value: inventory
      trends: '0'
      value_type: CHAR
    - uuid: 53f347d563224774bfd9f90155188c9b
      name: System contact
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.4.0
      key: switch.syscontact
      delay: 1h
      history: 30d
      tags:
      - tag: component
        value: inventory
      trends: '0'
      value_type: CHAR
    - uuid: 98e40ed7a14346a2a9e8c1efc6b8c2fb
      name: Number of interfaces
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.2.1.0
      key: switch.interfaces.count
      delay: 10m
      history: 30d
      tags:
      - tag: component
        value: interfaces
    - uuid: 46c4cfbfab6c44b48661ad9684a025a2
      name: System uptime
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.3.0
      key: switch.uptime
      delay: 5m
      history: 30d
      units: uptime
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: component
        value: system
    discovery_rules:
    - uuid: 77177e3f66a2491aa27bd294fb3e1006
      name: Network interface discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#IFOPERSTATUS},1.3.6.1.2.1.2.2.1.8,{#IFADMINSTATUS},1.3.6.1.2.1.2.2.1.7,{#IFNAME},1.3.6.1.2.1.31.1.1.1.1,{#IFDESCR},1.3.6.1.2.1.2.2.1.2,{#IFTYPE},1.3.6.1.2.1.2.2.1.3,{#IFALIAS},1.3.6.1.2.1.31.1.1.1.18]
      key: net.if.discovery
      delay: 1h
      lifetime: 7d
      item_prototypes:
      - uuid: 0d6f77bd0073405b8c4723f4a2ac7d3b
        name: 'Interface {#IFNAME}: Administrative status'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.2.2.1.7.{#SNMPINDEX}
        key: net.if.admin[{#SNMPINDEX}]
        delay: 1m
        history: 30d
        tags:
        - tag: component
          value: interface
        - tag: interface
          value: '{#IFNAME}'
        valuemap:
          name: 'HPE Aruba Networking CX 6300 JL665A: IF-MIB ifAdminStatus'
      - uuid: fd1d37ddf41543f78c246a1c925d9719
        name: 'Interface {#IFNAME}: Operational status'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.2.2.1.8.{#SNMPINDEX}
        key: net.if.oper[{#SNMPINDEX}]
        delay: 1m
        history: 30d
        tags:
        - tag: component
          value: interface
        - tag: interface
          value: '{#IFNAME}'
        valuemap:
          name: 'HPE Aruba Networking CX 6300 JL665A: IF-MIB ifOperStatus'
      - uuid: 537b97edde3a487dbce1338c11832377
        name: 'Interface {#IFNAME}: Alias'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.31.1.1.1.18.{#SNMPINDEX}
        key: net.if.alias[{#SNMPINDEX}]
        delay: 1m
        history: 30d
        tags:
        - tag: component
          value: interface
        - tag: interface
          value: '{#IFNAME}'
        value_type: CHAR
      - uuid: 7c6799011cf348ecaacf5d2c0695ade6
        name: 'Interface {#IFNAME}: Speed'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.31.1.1.1.15.{#SNMPINDEX}
        key: net.if.speed[{#SNMPINDEX}]
        delay: 1m
        history: 30d
        tags:
        - tag: component
          value: interface
        - tag: interface
          value: '{#IFNAME}'
        units: Mbit/s
      - uuid: 832b6d3d25d54f7fa21c5921ef7d6b76
        name: 'Interface {#IFNAME}: Inbound traffic'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.31.1.1.1.6.{#SNMPINDEX}
        key: net.if.in.bps[{#SNMPINDEX}]
        delay: 1m
        history: 30d
        tags:
        - tag: component
          value: traffic
        - tag: interface
          value: '{#IFNAME}'
        value_type: FLOAT
        units: bps
        preprocessing: &id001
        - type: CHANGE_PER_SECOND
          parameters:
          - ''
        - type: MULTIPLIER
          parameters:
          - '8'
      - uuid: d87ec450e85149dda0c91052035f5af3
        name: 'Interface {#IFNAME}: Outbound traffic'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.31.1.1.1.10.{#SNMPINDEX}
        key: net.if.out.bps[{#SNMPINDEX}]
        delay: 1m
        history: 30d
        tags:
        - tag: component
          value: traffic
        - tag: interface
          value: '{#IFNAME}'
        value_type: FLOAT
        units: bps
        preprocessing: *id001
      - uuid: a60787a3cfd44138a3f51df6c60bc799
        name: 'Interface {#IFNAME}: Inbound errors/sec'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.2.2.1.14.{#SNMPINDEX}
        key: net.if.in.errors[{#SNMPINDEX}]
        delay: 1m
        history: 30d
        tags:
        - tag: component
          value: errors
        - tag: interface
          value: '{#IFNAME}'
        value_type: FLOAT
        preprocessing: &id002
        - type: CHANGE_PER_SECOND
          parameters:
          - ''
      - uuid: 44ec4363777047fc9e50457266892ada
        name: 'Interface {#IFNAME}: Outbound errors/sec'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.2.2.1.20.{#SNMPINDEX}
        key: net.if.out.errors[{#SNMPINDEX}]
        delay: 1m
        history: 30d
        tags:
        - tag: component
          value: errors
        - tag: interface
          value: '{#IFNAME}'
        value_type: FLOAT
        preprocessing: *id002
      - uuid: 01b4a80c4c45485c947d8b6e99f10cfa
        name: 'Interface {#IFNAME}: Inbound discards/sec'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.2.2.1.13.{#SNMPINDEX}
        key: net.if.in.discards[{#SNMPINDEX}]
        delay: 1m
        history: 30d
        tags:
        - tag: component
          value: errors
        - tag: interface
          value: '{#IFNAME}'
        value_type: FLOAT
        preprocessing: *id002
      - uuid: 77ae87e8bf5f4f16ae64188949e4658b
        name: 'Interface {#IFNAME}: Outbound discards/sec'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.2.2.1.19.{#SNMPINDEX}
        key: net.if.out.discards[{#SNMPINDEX}]
        delay: 1m
        history: 30d
        tags:
        - tag: component
          value: errors
        - tag: interface
          value: '{#IFNAME}'
        value_type: FLOAT
        preprocessing: *id002
      graph_prototypes:
      - uuid: 310f601197354b12bf5aff611daf8018
        name: 'Interface {#IFNAME}: Traffic'
        graph_items:
        - color: 199C0D
          item:
            host: HPE Aruba Networking CX 6300 JL665A by SNMP
            key: net.if.in.bps[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: HPE Aruba Networking CX 6300 JL665A by SNMP
            key: net.if.out.bps[{#SNMPINDEX}]
      - uuid: c268f15b477f4caf9fb4391f92ccfb2b
        name: 'Interface {#IFNAME}: Errors and discards'
        graph_items:
        - color: F63100
          item:
            host: HPE Aruba Networking CX 6300 JL665A by SNMP
            key: net.if.in.errors[{#SNMPINDEX}]
        - sortorder: '1'
          color: A54F10
          item:
            host: HPE Aruba Networking CX 6300 JL665A by SNMP
            key: net.if.out.errors[{#SNMPINDEX}]
        - sortorder: '2'
          color: 2774A4
          item:
            host: HPE Aruba Networking CX 6300 JL665A by SNMP
            key: net.if.in.discards[{#SNMPINDEX}]
        - sortorder: '3'
          color: 6C59DC
          item:
            host: HPE Aruba Networking CX 6300 JL665A by SNMP
            key: net.if.out.discards[{#SNMPINDEX}]
    macros:
    - macro: '{$SNMP.TIMEOUT}'
      value: 5m
      description: Time without successful SNMP polling before the availability trigger fires.
    valuemaps:
    - uuid: 25d0dfcab3464716b02fd6c8c6601940
      name: 'HPE Aruba Networking CX 6300 JL665A: Zabbix SNMP availability'
      mappings:
      - value: '0'
        newvalue: Not available
      - value: '1'
        newvalue: Available
      - value: '2'
        newvalue: Unknown
    - uuid: b9dd2c11a06c4e3296fe6aac6a410122
      name: 'HPE Aruba Networking CX 6300 JL665A: IF-MIB ifAdminStatus'
      mappings:
      - value: '1'
        newvalue: Up
      - value: '2'
        newvalue: Down
      - value: '3'
        newvalue: Testing
    - uuid: 5e870a1d7e764191a60a70dfd6df506f
      name: 'HPE Aruba Networking CX 6300 JL665A: IF-MIB ifOperStatus'
      mappings:
      - value: '1'
        newvalue: Up
      - value: '2'
        newvalue: Down
      - value: '3'
        newvalue: Testing
      - value: '4'
        newvalue: Unknown
      - value: '5'
        newvalue: Dormant
      - value: '6'
        newvalue: Not present
      - value: '7'
        newvalue: Lower layer down
