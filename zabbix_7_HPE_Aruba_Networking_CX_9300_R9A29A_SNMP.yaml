zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: 09f886ad403040baac472e7e0b04ba29
    name: Templates/Network devices/Switches
  templates:
  - uuid: 407672bf93f0437396a04efd8e497162
    template: HPE Aruba Networking CX 9300 R9A29A by SNMP
    name: HPE Aruba Networking CX 9300 R9A29A by SNMP
    description: 'Zabbix 7.0 template for HPE Aruba Networking CX 9300 R9A29A.


      Uses vendor-neutral standard SNMP objects so the template is safe across firmware revisions: SNMPv2-MIB/MIB-II for system identity and uptime,
      plus IF-MIB for interface discovery, status, speed, traffic, errors and discards.


      The switch must have SNMP enabled and a matching SNMP interface configured on the Zabbix host. Vendor-private OIDs are intentionally not
      guessed. Models/families in this package were included only where SNMP support was verified at the product, family, or network-OS level.'
    vendor:
      name: OpenAI generated
      version: 7.0-1
    groups:
    - name: Templates/Network devices/Switches
    tags:
    - tag: class
      value: network switch
    - tag: manufacturer
      value: HPE Aruba Networking
    - tag: model
      value: CX 9300 R9A29A
    items:
    - uuid: 04793c0df4324fcf97f1ccfff72d33f0
      name: SNMP availability
      type: INTERNAL
      key: zabbix[host,snmp,available]
      delay: 1m
      history: 7d
      valuemap:
        name: 'HPE Aruba Networking CX 9300 R9A29A: Zabbix SNMP availability'
      tags:
      - tag: component
        value: availability
      triggers:
      - uuid: f2703bdd6f994b89aafc81afcb15535f
        expression: max(/HPE Aruba Networking CX 9300 R9A29A by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0
        name: 'CX 9300 R9A29A: No SNMP data collection'
        priority: HIGH
        description: Zabbix cannot poll this switch over SNMP.
    - uuid: ac4180a14d0a47fdb350a97237a48093
      name: System description
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.1.0
      key: switch.sysdescr
      delay: 1h
      history: 30d
      tags:
      - tag: component
        value: inventory
      trends: '0'
      value_type: TEXT
    - uuid: 960f1272f71d41038eafaa2adcac0f13
      name: System object ID
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.2.0
      key: switch.sysobjectid
      delay: 1h
      history: 30d
      tags:
      - tag: component
        value: inventory
      trends: '0'
      value_type: CHAR
    - uuid: b1353141b3354345a0c367d55cff8eef
      name: System name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.5.0
      key: switch.sysname
      delay: 10m
      history: 30d
      tags:
      - tag: component
        value: inventory
      trends: '0'
      value_type: CHAR
    - uuid: 1ec27b028fa54ded97c4b245f3092b78
      name: System location
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.6.0
      key: switch.syslocation
      delay: 1h
      history: 30d
      tags:
      - tag: component
        value: inventory
      trends: '0'
      value_type: CHAR
    - uuid: f8b9686a92194f06a7fcbd9c4cecfd14
      name: System contact
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.4.0
      key: switch.syscontact
      delay: 1h
      history: 30d
      tags:
      - tag: component
        value: inventory
      trends: '0'
      value_type: CHAR
    - uuid: dd758d017687414abcd4d4566642d142
      name: Number of interfaces
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.2.1.0
      key: switch.interfaces.count
      delay: 10m
      history: 30d
      tags:
      - tag: component
        value: interfaces
    - uuid: bb626f7523164ecaa72c088002483cd3
      name: System uptime
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.3.0
      key: switch.uptime
      delay: 5m
      history: 30d
      units: uptime
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: component
        value: system
    discovery_rules:
    - uuid: a70c1418c35d4fb3934f0053db5d649d
      name: Network interface discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#IFOPERSTATUS},1.3.6.1.2.1.2.2.1.8,{#IFADMINSTATUS},1.3.6.1.2.1.2.2.1.7,{#IFNAME},1.3.6.1.2.1.31.1.1.1.1,{#IFDESCR},1.3.6.1.2.1.2.2.1.2,{#IFTYPE},1.3.6.1.2.1.2.2.1.3,{#IFALIAS},1.3.6.1.2.1.31.1.1.1.18]
      key: net.if.discovery
      delay: 1h
      lifetime: 7d
      item_prototypes:
      - uuid: ead37a7ac89744c6b8ef20668085f9c8
        name: 'Interface {#IFNAME}: Administrative status'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.2.2.1.7.{#SNMPINDEX}
        key: net.if.admin[{#SNMPINDEX}]
        delay: 1m
        history: 30d
        tags:
        - tag: component
          value: interface
        - tag: interface
          value: '{#IFNAME}'
        valuemap:
          name: 'HPE Aruba Networking CX 9300 R9A29A: IF-MIB ifAdminStatus'
      - uuid: fd62545067c642489bdb67408fd2223d
        name: 'Interface {#IFNAME}: Operational status'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.2.2.1.8.{#SNMPINDEX}
        key: net.if.oper[{#SNMPINDEX}]
        delay: 1m
        history: 30d
        tags:
        - tag: component
          value: interface
        - tag: interface
          value: '{#IFNAME}'
        valuemap:
          name: 'HPE Aruba Networking CX 9300 R9A29A: IF-MIB ifOperStatus'
      - uuid: 9fa67cca7a11436798be2ff48cde8171
        name: 'Interface {#IFNAME}: Alias'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.31.1.1.1.18.{#SNMPINDEX}
        key: net.if.alias[{#SNMPINDEX}]
        delay: 1m
        history: 30d
        tags:
        - tag: component
          value: interface
        - tag: interface
          value: '{#IFNAME}'
        value_type: CHAR
      - uuid: a0749d024ed84e9790ce1bd0ab19406b
        name: 'Interface {#IFNAME}: Speed'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.31.1.1.1.15.{#SNMPINDEX}
        key: net.if.speed[{#SNMPINDEX}]
        delay: 1m
        history: 30d
        tags:
        - tag: component
          value: interface
        - tag: interface
          value: '{#IFNAME}'
        units: Mbit/s
      - uuid: b29e69ba84ea45729b35fe1ebb797dff
        name: 'Interface {#IFNAME}: Inbound traffic'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.31.1.1.1.6.{#SNMPINDEX}
        key: net.if.in.bps[{#SNMPINDEX}]
        delay: 1m
        history: 30d
        tags:
        - tag: component
          value: traffic
        - tag: interface
          value: '{#IFNAME}'
        value_type: FLOAT
        units: bps
        preprocessing: &id001
        - type: CHANGE_PER_SECOND
          parameters:
          - ''
        - type: MULTIPLIER
          parameters:
          - '8'
      - uuid: 1cbe5b2f84034ddf9a005324bda293b1
        name: 'Interface {#IFNAME}: Outbound traffic'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.31.1.1.1.10.{#SNMPINDEX}
        key: net.if.out.bps[{#SNMPINDEX}]
        delay: 1m
        history: 30d
        tags:
        - tag: component
          value: traffic
        - tag: interface
          value: '{#IFNAME}'
        value_type: FLOAT
        units: bps
        preprocessing: *id001
      - uuid: 33fc2c387cd14192b208329855786596
        name: 'Interface {#IFNAME}: Inbound errors/sec'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.2.2.1.14.{#SNMPINDEX}
        key: net.if.in.errors[{#SNMPINDEX}]
        delay: 1m
        history: 30d
        tags:
        - tag: component
          value: errors
        - tag: interface
          value: '{#IFNAME}'
        value_type: FLOAT
        preprocessing: &id002
        - type: CHANGE_PER_SECOND
          parameters:
          - ''
      - uuid: 032ef5d26ba14cf2b88280e2bb9036fc
        name: 'Interface {#IFNAME}: Outbound errors/sec'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.2.2.1.20.{#SNMPINDEX}
        key: net.if.out.errors[{#SNMPINDEX}]
        delay: 1m
        history: 30d
        tags:
        - tag: component
          value: errors
        - tag: interface
          value: '{#IFNAME}'
        value_type: FLOAT
        preprocessing: *id002
      - uuid: 88f35f78c0614ba6b57d92638a397feb
        name: 'Interface {#IFNAME}: Inbound discards/sec'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.2.2.1.13.{#SNMPINDEX}
        key: net.if.in.discards[{#SNMPINDEX}]
        delay: 1m
        history: 30d
        tags:
        - tag: component
          value: errors
        - tag: interface
          value: '{#IFNAME}'
        value_type: FLOAT
        preprocessing: *id002
      - uuid: c238b25d7f8e4696bedb746277e6cf82
        name: 'Interface {#IFNAME}: Outbound discards/sec'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.2.2.1.19.{#SNMPINDEX}
        key: net.if.out.discards[{#SNMPINDEX}]
        delay: 1m
        history: 30d
        tags:
        - tag: component
          value: errors
        - tag: interface
          value: '{#IFNAME}'
        value_type: FLOAT
        preprocessing: *id002
      graph_prototypes:
      - uuid: ef5e19181c694582ba00146d958cdf44
        name: 'Interface {#IFNAME}: Traffic'
        graph_items:
        - color: 199C0D
          item:
            host: HPE Aruba Networking CX 9300 R9A29A by SNMP
            key: net.if.in.bps[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: HPE Aruba Networking CX 9300 R9A29A by SNMP
            key: net.if.out.bps[{#SNMPINDEX}]
      - uuid: 3eb10673bf2e4fc8b3df01f7dae05281
        name: 'Interface {#IFNAME}: Errors and discards'
        graph_items:
        - color: F63100
          item:
            host: HPE Aruba Networking CX 9300 R9A29A by SNMP
            key: net.if.in.errors[{#SNMPINDEX}]
        - sortorder: '1'
          color: A54F10
          item:
            host: HPE Aruba Networking CX 9300 R9A29A by SNMP
            key: net.if.out.errors[{#SNMPINDEX}]
        - sortorder: '2'
          color: 2774A4
          item:
            host: HPE Aruba Networking CX 9300 R9A29A by SNMP
            key: net.if.in.discards[{#SNMPINDEX}]
        - sortorder: '3'
          color: 6C59DC
          item:
            host: HPE Aruba Networking CX 9300 R9A29A by SNMP
            key: net.if.out.discards[{#SNMPINDEX}]
    macros:
    - macro: '{$SNMP.TIMEOUT}'
      value: 5m
      description: Time without successful SNMP polling before the availability trigger fires.
    valuemaps:
    - uuid: 93da83c253e7427e9fd15f94776280d5
      name: 'HPE Aruba Networking CX 9300 R9A29A: Zabbix SNMP availability'
      mappings:
      - value: '0'
        newvalue: Not available
      - value: '1'
        newvalue: Available
      - value: '2'
        newvalue: Unknown
    - uuid: aa3c367d273f46c1a244b07343e2de88
      name: 'HPE Aruba Networking CX 9300 R9A29A: IF-MIB ifAdminStatus'
      mappings:
      - value: '1'
        newvalue: Up
      - value: '2'
        newvalue: Down
      - value: '3'
        newvalue: Testing
    - uuid: 98eb1da9dae8408fad47afd443c2ce48
      name: 'HPE Aruba Networking CX 9300 R9A29A: IF-MIB ifOperStatus'
      mappings:
      - value: '1'
        newvalue: Up
      - value: '2'
        newvalue: Down
      - value: '3'
        newvalue: Testing
      - value: '4'
        newvalue: Unknown
      - value: '5'
        newvalue: Dormant
      - value: '6'
        newvalue: Not present
      - value: '7'
        newvalue: Lower layer down
