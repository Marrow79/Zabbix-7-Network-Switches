zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: 09f886ad403040baac472e7e0b04ba29
    name: Templates/Network devices/Switches
  templates:
  - uuid: ebf06068341546a2900899dd8526405d
    template: TP-Link SG2210P by SNMP
    name: TP-Link SG2210P by SNMP
    description: 'Zabbix 7.0 template for TP-Link SG2210P.


      Uses vendor-neutral standard SNMP objects so the template is safe across firmware revisions: SNMPv2-MIB/MIB-II for system identity and uptime,
      plus IF-MIB for interface discovery, status, speed, traffic, errors and discards.


      The switch must have SNMP enabled and a matching SNMP interface configured on the Zabbix host. Vendor-private OIDs are intentionally not
      guessed. Models/families in this package were included only where SNMP support was verified at the product, family, or network-OS level.'
    vendor:
      name: OpenAI generated
      version: 7.0-1
    groups:
    - name: Templates/Network devices/Switches
    tags:
    - tag: class
      value: network switch
    - tag: manufacturer
      value: TP-Link
    - tag: model
      value: SG2210P
    items:
    - uuid: 7e4f128fed5c40c0ad87e234e4ceb3f5
      name: SNMP availability
      type: INTERNAL
      key: zabbix[host,snmp,available]
      delay: 1m
      history: 7d
      valuemap:
        name: 'TP-Link SG2210P: Zabbix SNMP availability'
      tags:
      - tag: component
        value: availability
      triggers:
      - uuid: f954204f2287432a8dee82c00cc564bc
        expression: max(/TP-Link SG2210P by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0
        name: 'SG2210P: No SNMP data collection'
        priority: HIGH
        description: Zabbix cannot poll this switch over SNMP.
    - uuid: fda4701098c1472b9ee454f188dce279
      name: System description
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.1.0
      key: switch.sysdescr
      delay: 1h
      history: 30d
      tags:
      - tag: component
        value: inventory
      trends: '0'
      value_type: TEXT
    - uuid: 36492ee950c44d1fa6927c034f09e7ff
      name: System object ID
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.2.0
      key: switch.sysobjectid
      delay: 1h
      history: 30d
      tags:
      - tag: component
        value: inventory
      trends: '0'
      value_type: CHAR
    - uuid: 871f483ff88743a1a0b5754bc853536e
      name: System name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.5.0
      key: switch.sysname
      delay: 10m
      history: 30d
      tags:
      - tag: component
        value: inventory
      trends: '0'
      value_type: CHAR
    - uuid: 70e021826b8d47fe813f445569efd0e4
      name: System location
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.6.0
      key: switch.syslocation
      delay: 1h
      history: 30d
      tags:
      - tag: component
        value: inventory
      trends: '0'
      value_type: CHAR
    - uuid: 7536571de26e44738f98da63cc6e984a
      name: System contact
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.4.0
      key: switch.syscontact
      delay: 1h
      history: 30d
      tags:
      - tag: component
        value: inventory
      trends: '0'
      value_type: CHAR
    - uuid: 8ca2df497aec47338205e0e62d24ad94
      name: Number of interfaces
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.2.1.0
      key: switch.interfaces.count
      delay: 10m
      history: 30d
      tags:
      - tag: component
        value: interfaces
    - uuid: d37e1d3470c2439092c49e4fef5ee309
      name: System uptime
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.3.0
      key: switch.uptime
      delay: 5m
      history: 30d
      units: uptime
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: component
        value: system
    discovery_rules:
    - uuid: 0eb9c8c2d8994212b1651b471ad38a35
      name: Network interface discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#IFOPERSTATUS},1.3.6.1.2.1.2.2.1.8,{#IFADMINSTATUS},1.3.6.1.2.1.2.2.1.7,{#IFNAME},1.3.6.1.2.1.31.1.1.1.1,{#IFDESCR},1.3.6.1.2.1.2.2.1.2,{#IFTYPE},1.3.6.1.2.1.2.2.1.3,{#IFALIAS},1.3.6.1.2.1.31.1.1.1.18]
      key: net.if.discovery
      delay: 1h
      lifetime: 7d
      item_prototypes:
      - uuid: dba0c3c126ac46ea8f3353ca2b5a4b8c
        name: 'Interface {#IFNAME}: Administrative status'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.2.2.1.7.{#SNMPINDEX}
        key: net.if.admin[{#SNMPINDEX}]
        delay: 1m
        history: 30d
        tags:
        - tag: component
          value: interface
        - tag: interface
          value: '{#IFNAME}'
        valuemap:
          name: 'TP-Link SG2210P: IF-MIB ifAdminStatus'
      - uuid: ef404670125246dab03f1a9547139753
        name: 'Interface {#IFNAME}: Operational status'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.2.2.1.8.{#SNMPINDEX}
        key: net.if.oper[{#SNMPINDEX}]
        delay: 1m
        history: 30d
        tags:
        - tag: component
          value: interface
        - tag: interface
          value: '{#IFNAME}'
        valuemap:
          name: 'TP-Link SG2210P: IF-MIB ifOperStatus'
      - uuid: 59af2d47711f4b0c953cf9bd67cbdf19
        name: 'Interface {#IFNAME}: Alias'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.31.1.1.1.18.{#SNMPINDEX}
        key: net.if.alias[{#SNMPINDEX}]
        delay: 1m
        history: 30d
        tags:
        - tag: component
          value: interface
        - tag: interface
          value: '{#IFNAME}'
        value_type: CHAR
      - uuid: 8ae7ac6a1a1c46b4b35490a54efaa6c8
        name: 'Interface {#IFNAME}: Speed'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.31.1.1.1.15.{#SNMPINDEX}
        key: net.if.speed[{#SNMPINDEX}]
        delay: 1m
        history: 30d
        tags:
        - tag: component
          value: interface
        - tag: interface
          value: '{#IFNAME}'
        units: Mbit/s
      - uuid: 044704be3ce04a6289e52af2725392d9
        name: 'Interface {#IFNAME}: Inbound traffic'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.31.1.1.1.6.{#SNMPINDEX}
        key: net.if.in.bps[{#SNMPINDEX}]
        delay: 1m
        history: 30d
        tags:
        - tag: component
          value: traffic
        - tag: interface
          value: '{#IFNAME}'
        value_type: FLOAT
        units: bps
        preprocessing: &id001
        - type: CHANGE_PER_SECOND
          parameters:
          - ''
        - type: MULTIPLIER
          parameters:
          - '8'
      - uuid: 6468b9b655594bf692c6142a50f28420
        name: 'Interface {#IFNAME}: Outbound traffic'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.31.1.1.1.10.{#SNMPINDEX}
        key: net.if.out.bps[{#SNMPINDEX}]
        delay: 1m
        history: 30d
        tags:
        - tag: component
          value: traffic
        - tag: interface
          value: '{#IFNAME}'
        value_type: FLOAT
        units: bps
        preprocessing: *id001
      - uuid: 65abe985c25c46fcb0b5395b7a811264
        name: 'Interface {#IFNAME}: Inbound errors/sec'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.2.2.1.14.{#SNMPINDEX}
        key: net.if.in.errors[{#SNMPINDEX}]
        delay: 1m
        history: 30d
        tags:
        - tag: component
          value: errors
        - tag: interface
          value: '{#IFNAME}'
        value_type: FLOAT
        preprocessing: &id002
        - type: CHANGE_PER_SECOND
          parameters:
          - ''
      - uuid: b76ac4d8b945423f975521987b8a96d9
        name: 'Interface {#IFNAME}: Outbound errors/sec'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.2.2.1.20.{#SNMPINDEX}
        key: net.if.out.errors[{#SNMPINDEX}]
        delay: 1m
        history: 30d
        tags:
        - tag: component
          value: errors
        - tag: interface
          value: '{#IFNAME}'
        value_type: FLOAT
        preprocessing: *id002
      - uuid: 058572ae55e847c8a66c0655b1f6d512
        name: 'Interface {#IFNAME}: Inbound discards/sec'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.2.2.1.13.{#SNMPINDEX}
        key: net.if.in.discards[{#SNMPINDEX}]
        delay: 1m
        history: 30d
        tags:
        - tag: component
          value: errors
        - tag: interface
          value: '{#IFNAME}'
        value_type: FLOAT
        preprocessing: *id002
      - uuid: 684b232b612145dda78498b03f270231
        name: 'Interface {#IFNAME}: Outbound discards/sec'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.2.2.1.19.{#SNMPINDEX}
        key: net.if.out.discards[{#SNMPINDEX}]
        delay: 1m
        history: 30d
        tags:
        - tag: component
          value: errors
        - tag: interface
          value: '{#IFNAME}'
        value_type: FLOAT
        preprocessing: *id002
      graph_prototypes:
      - uuid: dc1c91c906344a3cbc3ca6f378838a2b
        name: 'Interface {#IFNAME}: Traffic'
        graph_items:
        - color: 199C0D
          item:
            host: TP-Link SG2210P by SNMP
            key: net.if.in.bps[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: TP-Link SG2210P by SNMP
            key: net.if.out.bps[{#SNMPINDEX}]
      - uuid: 4f0d5d440aee4d44a383c5a613c3dc49
        name: 'Interface {#IFNAME}: Errors and discards'
        graph_items:
        - color: F63100
          item:
            host: TP-Link SG2210P by SNMP
            key: net.if.in.errors[{#SNMPINDEX}]
        - sortorder: '1'
          color: A54F10
          item:
            host: TP-Link SG2210P by SNMP
            key: net.if.out.errors[{#SNMPINDEX}]
        - sortorder: '2'
          color: 2774A4
          item:
            host: TP-Link SG2210P by SNMP
            key: net.if.in.discards[{#SNMPINDEX}]
        - sortorder: '3'
          color: 6C59DC
          item:
            host: TP-Link SG2210P by SNMP
            key: net.if.out.discards[{#SNMPINDEX}]
    macros:
    - macro: '{$SNMP.TIMEOUT}'
      value: 5m
      description: Time without successful SNMP polling before the availability trigger fires.
    valuemaps:
    - uuid: 0296c13ca7e048299a33035851abe912
      name: 'TP-Link SG2210P: Zabbix SNMP availability'
      mappings:
      - value: '0'
        newvalue: Not available
      - value: '1'
        newvalue: Available
      - value: '2'
        newvalue: Unknown
    - uuid: d1ed557bee2641a4952cf96c661fe964
      name: 'TP-Link SG2210P: IF-MIB ifAdminStatus'
      mappings:
      - value: '1'
        newvalue: Up
      - value: '2'
        newvalue: Down
      - value: '3'
        newvalue: Testing
    - uuid: 74cbb63d0d46441db7f4e5ee5d3ade1c
      name: 'TP-Link SG2210P: IF-MIB ifOperStatus'
      mappings:
      - value: '1'
        newvalue: Up
      - value: '2'
        newvalue: Down
      - value: '3'
        newvalue: Testing
      - value: '4'
        newvalue: Unknown
      - value: '5'
        newvalue: Dormant
      - value: '6'
        newvalue: Not present
      - value: '7'
        newvalue: Lower layer down
